 {id:'dateien',t:'📁 Dateien, Cloud und Verbindungen',h:`<ul><li><b>📁 Dateien:</b> alles, was die Agenten erzeugt haben. Antippen öffnet, „⬇ Alles als ZIP“ lädt das Projekt herunter. Hochgeladene Dateien landen in <code>input/</code>.</li>
<li><b>Webseite veröffentlichen:</b> Liegt <code>www/index.html</code> im Projekt, kann Hyperstead sie als Webseite ausliefern („Veröffentlichen“).</li>
<li><b>☁️ Cloud:</b> GitHub, Google Drive, OneDrive und Telegram einrichten. Jeder Upload eines Agenten wartet auf deine Freigabe. ☁️ neben einer Datei lädt sie selbst hoch.</li>
<li><b>🔌 Verbindungen:</b> Webhooks. Agenten mit dem Recht „Verbindungen“ dürfen deine eingetragenen Adressen aufrufen (z. B. Zapier, Home Assistant), Hyperstead meldet neue Post an einen Dienst, oder andere Programme schicken über eine geheime Eingangsadresse Aufträge herein. Ohne Eintrag passiert nichts.</li></ul>`},
 {id:'stimmen',t:'🎙 Stimmen und ElevenLabs',h:`<p>Agenten mit dem Recht „Medien“ können Texte sprechen lassen (Werkzeug <code>speak</code>) und Filmfiguren vertonen. Normal läuft das kostenlos auf deinem Gerät (Piper, espeak-ng oder Edge-Stimmen).</p>
<ul><li><b>Bessere Stimmen mit ElevenLabs:</b> Trage in der Datei <code>.env</code> <code>ELEVENLABS_API_KEY=…</code> ein (Schlüssel aus elevenlabs.io → Profil → API Keys) und starte Hyperstead neu. Den Schlüssel nie in der Oberfläche oder im Chat eingeben.</li>
<li><b>Nur wenn nötig:</b> Mit Schlüssel bleibt alles zuerst lokal und kostenlos. Die Agenten nehmen ElevenLabs gezielt dort, wo die Stimme wirklich gut klingen muss, z. B. Hörbuch, Werbung, Hauptfiguren oder Erzähler im Film. Du kannst es im Auftrag auch ausdrücklich sagen: „Sprich das mit ElevenLabs“.</li>
<li><b>Immer ElevenLabs:</b> <code>TTS_ENGINE=elevenlabs</code> in der <code>.env</code>. Standardstimme mit <code>ELEVENLABS_VOICE=&lt;Stimmen-ID&gt;</code>, Modell mit <code>ELEVENLABS_TTS_MODEL</code> (Standard <code>eleven_multilingual_v2</code>, spricht auch Deutsch und Türkisch).</li>
<li><b>Eigene Stimme je Figur:</b> Die Agenten holen sich die Stimmen deines ElevenLabs-Kontos selbst und tragen die passende Stimmen-ID bei der Figur ein.</li>
<li><b>Wenn ElevenLabs nicht klappt</b> (Schlüssel falsch, Guthaben leer, kein Internet): Dann spricht automatisch die lokale Stimme, und im Ergebnis steht ein HINWEIS mit dem Grund. Im Film wird die Zeile beim nächsten Vertonen noch einmal mit ElevenLabs versucht. Mit <code>TTS_FALLBACK=0</code> bricht die Aufgabe stattdessen mit der Fehlermeldung ab.</li>
<li><b>Kosten:</b> ElevenLabs rechnet pro Zeichen ab. Ohne Schlüssel entstehen keine Kosten, alles läuft wie bisher.</li></ul>`},
 {id:'telegram',t:'📱 Telegram',h:`<p>Mit <code>TELEGRAM_BOT_TOKEN</code> und <code>TELEGRAM_CHAT_ID</code> in der <code>.env</code> steuerst du Hyperstead vom Handy. Nur deine Chat-ID darf steuern.</p>
<ul><li>Einfach Text schreiben = neuer Auftrag an den Chef des gewählten Projekts. Fotos/Dateien mit Bildunterschrift = Auftrag mit Anhang.</li>
<li><code>/post</code> offene Ergebnisse, <code>/ok &lt;Nr&gt;</code> erledigt, Antwort auf eine Ergebnis-Nachricht = Überarbeitung.</li>
<li><code>/status</code> Überblick, <code>/projekt &lt;Nr&gt;</code> Projekt wechseln, <code>/neu &lt;Text&gt;</code> neuer Auftrag, <code>/datei [suche]</code> Datei schicken lassen, <code>/hilfe</code> alle Befehle.</li>
<li>Freigaben kommen mit Knöpfen ✅/❌, ebenso Stufenaufstiege 🎉.</li></ul>`},
 {id:'probleme',t:'🧯 Was tun, wenn …',h:`<ul><li><b>… ein Agent nichts tut:</b> Hat er eine KI? (Einstellungen, „▶ Testen“). Sind Öffnungszeiten aktiv? Wartet etwas unter ✋ Freigaben?</li>
<li><b>… eine Aufgabe „Fehler“ zeigt:</b> In der 🛰 Betriebszentrale steht die Meldung. Häufig: Key fehlt oder Guthaben leer. Nach dem Beheben „↻ Neu“.</li>
<li><b>… ⚠ Modelle eine Zahl zeigt:</b> Ein Modell gibt es beim Anbieter nicht mehr. Dort gesammelt umstellen.</li>
<li><b>… der Chef nur plant und nichts liefert:</b> Rechte prüfen (Dateien schreiben, Medien), im Auftrag genau sagen, welche Datei am Ende da sein soll.</li>
<li><b>… Telegram schweigt:</b> Token und Chat-ID in <code>.env</code> prüfen, Hyperstead neu starten, dem Bot <code>/start</code> schreiben.</li>
<li><b>… nach einem Update etwas fehlt:</b> Die README hat die Tabelle „Was passiert, wenn etwas fehlt“ mit der Lösung für jede Datei und jeden Schlüssel.</li></ul>`},
 {id:'firmen',t:'🏙 Alle Firmen: klassisch und modern',h:`<p>Hyperstead hat zwei Ebenen. Beide zeigen dieselben echten Firmen, Abteilungen und Agenten, nur anders gezeichnet.</p>
<ul><li><b>📐 Klassisch:</b> die sachlichen Ansichten einer Firma (Organigramm, Bauplan, Weltall, Atom). Hier verwaltest und stellst du ein.</li>
<li><b>Modern:</b> alle Firmen auf einmal. Du öffnest sie mit 🏙 bei „Projekte“ oder in der Grafik-Auswahl mit „🏙 Alle Firmen (modern)“. Oben schaltest du zwischen 📐 Klassisch, 🏙 Stadt und 🌌 Kosmos um.</li>
<li><b>🏙 Stadt:</b> Jede Firma ist ein Gebäude auf eigenem Grundstück. Je weiter sie gewachsen ist, desto höher das Haus. Leuchtende Fenster heißen: dort wird gerade gearbeitet.</li>
<li><b>🌌 Kosmos:</b> Jede Firma ist ein Sonnensystem. Die Sonne ist die Leitung, die Planeten sind die Abteilungen (größer = mehr Agenten). Ein leuchtender Ring heißt: diese Abteilung arbeitet gerade. Zwischen den Systemen gibt es keine Linien.</li>
<li><b>Hineingehen:</b> Eine Firma antippen zoomt hinein. In der Stadt siehst du das Gebäude von innen: unten (EG) die Leitung, darüber eine Etage je Abteilung, die Agenten an ihren Tischen. Ein leuchtender Bildschirm heißt: dieser Agent arbeitet gerade. Im Kosmos wird das Sonnensystem groß: die Sonne ist die Leitung, jeder Planet eine Abteilung, die Monde sind ihre Agenten.</li>
<li><b>Abteilung öffnen:</b> Links (auf dem Handy unten) steht die Liste der Abteilungen. Eine Abteilung, Etage oder ein Planet antippen zeigt rechts ihr Team mit Rolle, Zustand und laufenden Aufgaben. Ein Name darin öffnet den Agenten in der klassischen Ansicht mit Aufgaben, Chat und Einstellungen. Was du dort änderst, siehst du danach auch in Stadt und Kosmos.</li>
<li><b>← Alle Firmen</b> oder Esc führt wieder hinaus.</li>
<li><b>🔍 Suche:</b> oben Firma oder Agent eintippen (Name oder Rolle). Ein Treffer zoomt in die Firma und zeigt den Agenten in seiner Abteilung.</li></ul>`},
 {id:'hilfe',t:'❓ Hilfe-Modus und Hinweise',h:`<p>Fast jeder Knopf hat eine kurze Erklärung. Am PC erscheint sie, wenn du mit der Maus darauf zeigst.</p>
<p>Auf dem Handy gibt es kein Draufzeigen. Schalte dafür hier den <b>Hilfe-Modus</b> ein: Dann zeigt das erste Tippen auf einen Knopf die Erklärung, erst das zweite Tippen führt ihn aus. Unten erscheint eine Leiste, mit „Aus“ beendest du ihn.</p>
<p>ⓘ oben in einem Fenster springt direkt zum passenden Kapitel dieser Anleitung.</p>`},
];
const HELP_MAP=[['Freigaben','auftraege'],['Post','auftraege'],['Ziele','auftraege'],['Zeitplan','zeitplan'],['Cloud','dateien'],['Hochladen','dateien'],['Dateien','dateien'],['🔌','dateien'],['Betriebszentrale','betrieb'],['Nutzung','betrieb'],['Verlauf','betrieb'],['Wachstum','welt'],['Modelle','agenten'],['KI für','agenten'],['Firmenwissen','agenten'],['Vorlage','start'],['Stimme','stimmen']];
function helpFor(title){ if(String(title).startsWith('📖')) return null; const m=HELP_MAP.find(([k])=>String(title).includes(k)); return m?m[1]:null; }
function showHelp(chapter){
  openOv('📖 Anleitung'); const body=$('#ovbody');
  body.innerHTML=`<input type="search" class="help-search" id="hsearch" placeholder="Suchen, z. B. Telegram, Kosten, Freigabe …" aria-label="Anleitung durchsuchen">
    <div class="chk" style="margin-bottom:10px"><input type="checkbox" id="hmode" ${helpModeOn()?'checked':''}><div>Hilfe-Modus (fürs Handy)<small>Erstes Tippen auf einen Knopf erklärt ihn, das zweite führt ihn aus.</small></div></div>
    <div id="hlist">${HELP.map(c=>`<details class="help-sec" id="help_${c.id}" ${c.id===chapter?'open':''}><summary>${c.t}</summary><div class="hb">${c.h}</div></details>`).join('')}</div>
    <div class="ops-empty" id="hnone" style="display:none">Nichts gefunden.</div>`;
  $('#hmode').onchange=e=>setHelpMode(e.target.checked);
  const orig={}; HELP.forEach(c=>orig[c.id]=c.h);
  $('#hsearch').oninput=e=>{
    const q=e.target.value.trim().toLowerCase(); let n=0;
    HELP.forEach(c=>{ const d=$('#help_'+c.id), hb=d.querySelector('.hb');
      const hit=!q || (c.t+' '+c.h.replace(/<[^>]+>/g,' ')).toLowerCase().includes(q);
      d.style.display=hit?'':'none'; if(hit) n++;
      d.open = q ? hit : c.id===chapter;
      hb.innerHTML = q&&hit ? markHits(orig[c.id], q) : orig[c.id]; });
    $('#hnone').style.display=n?'none':'';
  };
  if(chapter) setTimeout(()=>{ const d=$('#help_'+chapter); if(d) d.scrollIntoView({block:'start'}); },30);
}
function markHits(html,q){ const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); return html.replace(/>([^<]+)</g,(m,t)=>'>'+t.replace(re,'<mark>$1</mark>')+'<'); }
$('#btnHelp').onclick=()=>showHelp('start');

function applyTips(root){
  (root||document).querySelectorAll('button:not([title]),a:not([title]),[role=button]:not([title])').forEach(el=>{
    for(const k in TIPS){ if(el.matches(k)){ const v=typeof TIPS[k]==='function'?TIPS[k](el):TIPS[k]; if(v) el.title=v; return; } }
    if(el.tagName==='A' && el.target==='_blank') el.title='Öffnet in einem neuen Tab';
    else if(el.getAttribute('onclick')&&el.getAttribute('onclick').startsWith('copyText')) el.title='In die Zwischenablage kopieren';
  });
}
new MutationObserver(ms=>{ for(const m of ms) m.addedNodes.forEach(n=>{ if(n.nodeType===1) applyTips(n.parentNode||n); }); }).observe(document.body,{childList:true,subtree:true});
applyTips();
function helpModeOn(){ return document.documentElement.dataset.helpmode==='on'; }
function setHelpMode(on){ if(on) document.documentElement.dataset.helpmode='on'; else delete document.documentElement.dataset.helpmode; try{ localStorage.setItem('hs-helpmode',on?'on':'off'); }catch(e){} hideTip(); }
try{ if(localStorage.getItem('hs-helpmode')==='on') document.documentElement.dataset.helpmode='on'; }catch(e){}
let tipFor=null, tipT=null;
function hideTip(){ $('#tipbox').classList.remove('on'); tipFor=null; }
function showTip(el){
  const b=$('#tipbox'); b.textContent=el.title||el.getAttribute('aria-label')||''; b.classList.add('on');
  const r=el.getBoundingClientRect(), w=b.offsetWidth, h=b.offsetHeight;
  b.style.left=Math.max(12,Math.min(innerWidth-w-12,r.left+r.width/2-w/2))+'px';
  b.style.top=(r.bottom+8+h<innerHeight? r.bottom+8 : Math.max(12,r.top-h-8))+'px';
  tipFor=el; clearTimeout(tipT); tipT=setTimeout(hideTip,7000);
}
document.addEventListener('click',e=>{
  if(!helpModeOn()) return;
  const el=e.target.closest('button,a,[role=button],select,input[type=checkbox]');
  if(!el || el.id==='helpoff' || el.id==='hmode' || !(el.title||el.getAttribute('aria-label'))) { hideTip(); return; }
  if(tipFor===el){ hideTip(); return; }   // zweites Tippen: normal ausführen
  e.preventDefault(); e.stopPropagation(); showTip(el);
},true);
$('#helpoff').onclick=()=>setHelpMode(false);

/* ---------- Welten und Wachstum (Hyperstead) ---------- */
const WORLD = {list:null, g:null, at:0};
function wdef(){ return (WORLD.list && WORLD.g && WORLD.list.worlds[WORLD.g.world]) || null; }
function wword(k, dflt){ const w=wdef(); return (w && w.words[k]) || dflt; }
function applyWorldColors(){
  const w = wdef(), r = document.documentElement.style;
  if(!w){ r.removeProperty('--accent'); r.removeProperty('--accent2'); r.removeProperty('--ground'); return; }
  r.setProperty('--accent', w.colors.accent); r.setProperty('--accent2', w.colors.accent2);
  const light = document.documentElement.dataset.theme==='light' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: light)').matches);
  r.setProperty('--ground', light ? w.colors.ground : w.colors.ground_dark);
}
async function loadGrowth(force){
  if(!S.pid){ WORLD.g=null; renderGrowth(); return; }
  if(!force && Date.now()-WORLD.at < 10000) return;
  WORLD.at = Date.now();
  try{
    if(!WORLD.list) WORLD.list = await api('/worlds');
    const pid = S.pid, g = await api('/projects/'+pid+'/growth');
    if(pid!==S.pid) return;
    const before = WORLD.g && WORLD.g.pid===pid ? WORLD.g.stage : null;
    const first = !WORLD.g || WORLD.g.pid!==pid;
    const oldRanks = !first && WORLD.g.ranks || null;
    WORLD.g = {...g, pid};
    if(oldRanks) Object.entries(g.ranks||{}).forEach(([id,r])=>{ const o=oldRanks[id];
      if(o && r.rank>o.rank){ const a=((S.graph&&S.graph.agents)||[]).find(x=>x.id===+id); toast(`🎉 ${a?a.name:'Ein Agent'} ist jetzt ${r.icon} ${r.name}`); } });
    if(first){ renderGrowth(); render(); fit(); syncWorld(); }
    if(before!==null && g.stage>before) celebrate(g);
  }catch(e){ return; }
  renderGrowth(); render();
}
function renderGrowth(){
  const el=$('#growth'), g=WORLD.g, w=wdef();
  el.classList.toggle('on', !!(g && w && S.graph));
  applyWorldColors();
  if(!g || !w) return;
  $('#gIco').textContent = g.icon;
  $('#gName').textContent = g.name+' · Stufe '+(g.stage+1)+'/'+g.stage_count;
  $('#gSub').textContent = g.next!==null ? `${g.points} ${w.words.points} · noch ${g.next-g.points} bis ${g.next_icon} ${g.next_name}` : `${g.points} ${w.words.points} · höchste Stufe erreicht`;
  $('#gBar').style.width = Math.round(g.progress*100)+'%';
  const ags=(S.graph&&S.graph.agents)||[]; let run=0, done=0;
  ags.forEach(a=>{ const c=a.counts||{}; run+=(c.running||0)+(c.queued||0)+(c.waiting_subtasks||0); done+=(c.done||0); });
  $('#gStats').innerHTML = `<span>👥 <b>${ags.length}</b>${g.limits&&g.team_limit?' / '+g.team_limit:''}</span><span>▶ <b>${run}</b> läuft</span><span>✓ <b>${done}</b> ${esc(w.words.done)}</span><span>✋ <b>${(S.graph&&S.graph.pending_approvals)||0}</b> Freigaben</span><span title="Geschätzte KI-Kosten heute (${g.calls_today||0} Aufrufe)">💶 <b>${usdShort(g.cost_today)}</b> heute</span>`;
}
function usdShort(c){ c=c||0; return c>0&&c<0.01?'< 0,01 $':c.toLocaleString('de-AT',{maximumFractionDigits:2})+' $'; }
$('#gStats').onclick = ()=>showOps();
$('#gStats').title = 'Betriebszentrale öffnen';
$('#gTheme').onclick = ()=>{
  const d=document.documentElement, cur=d.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
  d.dataset.theme = cur==='light'?'dark':'light';
  try{ localStorage.setItem('hs-theme', d.dataset.theme); }catch(e){}
  applyWorldColors();
};

$('#gInfo').onclick = ()=>{
  const g=WORLD.g, w=wdef(), L=WORLD.list; if(!g||!w) return;
  openOv(`${g.world==='atom'?'⚛️':'🌌'} ${w.name} und Wachstum`);

  $('#ovbody').innerHTML = `<div style="color:var(--mute);font-size:12px;margin-bottom:10px">${esc(w.tagline)} ${esc(w.explain||'')} Die Welt ändert nur Aussehen und Begriffe; welche gilt, bestimmt die Grafik-Auswahl (🌌 Weltall oder ⚛️ Atom). Die Agenten arbeiten weiter mit klaren Begriffen, ihre Qualität bleibt gleich.</div>
    <div class="tlabel">Stufen</div>

function teamsOf(g){
  // Ein "Team" je Sonne (oberste Ebene) und je Agent mit Unterstellten; members = alle direkt Unterstellten.
  const kids = {}; g.agents.forEach(a=>{ if(a.parent_id && agentById(a.parent_id)) (kids[a.parent_id]=kids[a.parent_id]||[]).push(a); });
  const roots = g.agents.filter(a=>!a.parent_id || !agentById(a.parent_id));
  const teams = [];
  const walk = (a, pt)=>{ const ks=kids[a.id]||[]; let t=null;
    if(!pt || ks.length){ t={lead:a, members:ks, parent:pt, kids:[], idx:teams.length}; teams.push(t); if(pt) pt.kids.push(t); }
    ks.forEach(k=>walk(k, t)); };
  roots.forEach(r=>walk(r, null));
  MAP.kids = kids;
  return teams;
}

  c.text = c.appr?'wartet auf deine Freigabe':c.run?`${c.run} in Arbeit`:c.fail?`${c.fail} fehlgeschlagen`:c.wait?'wartet auf Zulieferung':c.done?`${c.done} erfüllt`:'bereit';

}

const STATE_TEXT = {paused:'pausiert', appr:'wartet auf deine Freigabe', run:'arbeitet', fail:'Fehler', wait:'wartet auf Zulieferung', idle:'bereit'};

function sysLayout(root){
  const kids=MAP.kids, stage=(WORLD.g&&WORLD.g.stage)||0, sunR=30+stage*4;

    const ms=kids[a.id]||[], pr=15+Math.min(ms.length,8)*1.3;
    const mr= ms.length ? pr+24+Math.max(0,ms.length-6)*3 : 0;
    const deep = ms.some(m=>kids[m.id]);
    return {a, i, pr, mr, ms, ext: ms.length ? mr+8+(deep?10:0) : pr};

  const E = Math.max(16, ...planets.map(p=>p.ext)), orbits=[];

/* ---------- Moderne Ebene: alle Firmen als Stadt oder Kosmos (Plan docs/ebenen-plan.md). Firma = Projekt ----------

const HUB_FLOORS=[1,2,3,5,7], HUB_FH=14, HUB_TW=170, HUB_TH=85, HUB_GAP=.85;
async function loadFirms(force){

function hubColor(f){ const i=HUB.d.firms.indexOf(f); return COLORS[(i<0?0:i)%COLORS.length]; }

  return '#'+c.map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('');

function hubTeams(f){  // Leitung (Wurzeln) + Abteilungen (je direkt Unterstellter einer Wurzel mit seinem ganzen Team)
  const ids=new Set(f.agents.map(a=>a.id)), kids={};
  f.agents.forEach(a=>{ if(a.parent_id && ids.has(a.parent_id)) (kids[a.parent_id]=kids[a.parent_id]||[]).push(a); });
  const below=a=>[a,...(kids[a.id]||[]).flatMap(below)];

    <radialGradient id="aGlow"><stop offset="0" stop-color="#7dd3fc" stop-opacity=".55"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></radialGradient>
    <radialGradient id="aHalo"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".25" stop-color="#dbe6ff" stop-opacity=".25"/><stop offset="1" stop-color="#dbe6ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="aNucGlow"><stop offset=".25" stop-color="#fca5a5" stop-opacity=".22"/><stop offset="1" stop-color="#fca5a5" stop-opacity="0"/></radialGradient></defs>`;
  const back=`<g>${atomSky({x0:-R-320,x1:R+320,y0:-R-220,y1:R+220}, (WORLD.g&&WORLD.g.stage)||0, R)}</g>`;
  svg.innerHTML=defs+back+`<g>${orbits.join('')}</g>`+nuc+els.join('');
  ATOM.box={x0:-R-50, x1:R+50, y0:-R-40, y1:R+40};
  ATOM.els=[...svg.querySelectorAll('.amv')];
  atomPlace();
}
function atomSky(b, stage, R0){  // Welt Atom: ruhiger Hintergrund, der mit der Stufe waechst (Quark, Atom, Molekuel, Kristall, Zelle)
  const RND=rnd((S.pid||1)*977), W=b.x1-b.x0, H=b.y1-b.y0, out=[];
  for(let i=0;i<260;i++){ const m=Math.pow(RND(),3); out.push(`<circle cx="${(b.x0+RND()*W).toFixed(0)}" cy="${(b.y0+RND()*H).toFixed(0)}" r="${(.3+m*1.4).toFixed(2)}" fill="${RND()>.5?'#67e8f9':'#c4b5fd'}" opacity="${(.12+m*.4).toFixed(2)}"/>`); }
  if(stage>=4){  // Zelle: Membran und Erbgut-Doppelhelix
    out.push(`<circle r="${(R0*1.55).toFixed(0)}" fill="none" stroke="#34d399" stroke-opacity=".10" stroke-width="40"/><circle r="${(R0*1.55).toFixed(0)}" fill="none" stroke="#34d399" stroke-opacity=".18" stroke-width="2"/>`);
    let h=''; const x0=b.x0+W*.06, len=W*.88;
    for(let i=0;i<=64;i++){ const t=i/64, x=x0+t*len, y=b.y0+H*.86-t*H*.12, a=t*Math.PI*9, d=26*Math.sin(a);
      h+=`<circle cx="${x.toFixed(0)}" cy="${(y+d).toFixed(0)}" r="3" fill="#f472b6" opacity=".35"/><circle cx="${x.toFixed(0)}" cy="${(y-d).toFixed(0)}" r="3" fill="#60a5fa" opacity=".35"/>`;
      if(i%2===0) h+=`<line x1="${x.toFixed(0)}" y1="${(y+d).toFixed(0)}" x2="${x.toFixed(0)}" y2="${(y-d).toFixed(0)}" stroke="#e0f2fe" stroke-opacity=".12"/>`; }
    out.push(`<g>${h}</g>`);
  }
  if(stage>=3){  // Kristall: Gitter aus Atomen
    let h=''; const step=120;
    for(let x=Math.floor(b.x0/step)*step; x<=b.x1; x+=step) for(let y=Math.floor(b.y0/step)*step; y<=b.y1; y+=step){
      if(Math.hypot(x,y)<R0*1.15) continue;
      h+=`<line x1="${x}" y1="${y}" x2="${x+step}" y2="${y}" stroke="#a5f3fc" stroke-opacity=".06"/><line x1="${x}" y1="${y}" x2="${x}" y2="${y+step}" stroke="#a5f3fc" stroke-opacity=".06"/><circle cx="${x}" cy="${y}" r="4" fill="#a5f3fc" opacity=".14"/>`; }
    out.push(`<g>${h}</g>`);
  }
  if(stage>=2){  // Molekuel: Nachbaratome mit Bindungen zum eigenen Atom
    const n=3+Math.min(2,stage-2);
    for(let i=0;i<n;i++){ const a=-2.2+i*2*Math.PI/n+RND()*.4, d=R0*1.32, x=Math.cos(a)*d, y=Math.sin(a)*d*.8, r0=R0*.22;
      const bx=Math.cos(a)*R0*.16, by=Math.sin(a)*R0*.13, ex=x-Math.cos(a)*r0, ey=y-Math.sin(a)*r0*.8, nx=-Math.sin(a)*4, ny=Math.cos(a)*4;
      out.push(`<line x1="${(bx+nx).toFixed(0)}" y1="${(by+ny).toFixed(0)}" x2="${(ex+nx).toFixed(0)}" y2="${(ey+ny).toFixed(0)}" stroke="#e0f2fe" stroke-opacity=".16" stroke-width="2"/><line x1="${(bx-nx).toFixed(0)}" y1="${(by-ny).toFixed(0)}" x2="${(ex-nx).toFixed(0)}" y2="${(ey-ny).toFixed(0)}" stroke="#e0f2fe" stroke-opacity=".16" stroke-width="2"/>
        <g transform="translate(${x.toFixed(0)},${y.toFixed(0)})" opacity=".55"><ellipse rx="${r0.toFixed(0)}" ry="${(r0*.34).toFixed(0)}" class="aorbit" transform="rotate(30)"/><ellipse rx="${r0.toFixed(0)}" ry="${(r0*.34).toFixed(0)}" class="aorbit" transform="rotate(-30)"/><circle r="${(r0*.18).toFixed(0)}" fill="url(#aP)"/></g>`); }
  }
  if(stage<=0){  // Quark: drei farbige Quarks leuchten im Kern
    out.push(['#ef4444','#22c55e','#3b82f6'].map((c,i)=>`<circle cx="${(Math.cos(i*2.094-1.57)*16).toFixed(0)}" cy="${(Math.sin(i*2.094-1.57)*16).toFixed(0)}" r="70" fill="${c}" opacity=".07"/>`).join(''));
  }
  return out.join('');
}
function atomPlace(){  // feste Plaetze auf den Bahnen, die Grafik bewegt sich nicht (Wunsch ABI)
  ATOM.mv.forEach((m,i)=>{ const el=ATOM.els[i]; if(!el) return; const a=m.a0, x=m.rx*Math.cos(a), y=m.ry*Math.sin(a), c=Math.cos(m.rot), s=Math.sin(m.rot);
    el.setAttribute('transform',`translate(${(x*c-y*s).toFixed(1)},${(x*s+y*c).toFixed(1)})`); });
}
$('#atomsvg').addEventListener('click', e=>{ if(MAP.down && Math.hypot(e.clientX-MAP.down.x, e.clientY-MAP.down.y)>6) return; const c=e.target.closest('[data-agent]'); if(c) selectAgent(+c.dataset.agent); });
$('#atomsvg').addEventListener('keydown', e=>{ if(e.key!=='Enter' && e.key!==' ') return; const c=e.target.closest('[data-agent]'); if(c){ e.preventDefault(); selectAgent(+c.dataset.agent); } });
