<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyperstead</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/logo/hyperstead-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/logo/hyperstead-192.png">
<link rel="apple-touch-icon" href="/static/logo/hyperstead-180.png">
<style>
:root{
  --bg:#0b0b0c; --panel:#111113; --panel2:#17171a; --line:#27272b; --text:#e8e8ea; --mute:#8b8b93;
  --accent:#f97316; --accent2:#7c3aed; --blue:#3b82f6; --green:#22c55e; --red:#ef4444; --yellow:#eab308; --orange:#f59e0b;
  --chip:#1f1f24; --dotgrid:#24242a; --edge:#6b6b78; --hover:#3a3a43; --toastbg:#3a1616; --ground:#0f1a26;
}
/* Helles Design (Schalter in der Kopfleiste, Standard folgt dem Geraet) */
:root[data-theme="light"]{
  --bg:#f5f6f8; --panel:#ffffff; --panel2:#f0f2f5; --line:#dde1e7; --text:#1b1f27; --mute:#667085;
  --chip:#e8ebf0; --dotgrid:#d5dae2; --edge:#9aa3b2; --hover:#b8c0cc; --toastbg:#fdecec;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f6f8; --panel:#ffffff; --panel2:#f0f2f5; --line:#dde1e7; --text:#1b1f27; --mute:#667085;
    --chip:#e8ebf0; --dotgrid:#d5dae2; --edge:#9aa3b2; --hover:#b8c0cc; --toastbg:#fdecec;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:230px 1fr 0;height:100%}
#app.panel-open{grid-template-columns:230px 1fr 400px}
/* Sidebar */
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.logo{width:30px;height:30px;border-radius:9px;display:block;object-fit:cover}
.side-sec{padding:6px 10px}
.side-h{font-size:11px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase;padding:10px 6px 4px;display:flex;justify-content:space-between;align-items:center}
.side-btn{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;gap:8px;align-items:center;color:var(--text)}
.side-btn:hover{background:var(--panel2)}
.side-btn.active{background:var(--chip)}
.side-grp{margin:2px 0}
.side-grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600;user-select:none}
.side-grp>summary::-webkit-details-marker{display:none}
.side-grp>summary::after{content:'▸';margin-left:auto;transition:transform .15s}
.side-grp[open]>summary::after{transform:rotate(90deg)}
.side-grp>summary:hover{background:var(--panel2);color:var(--text)}
.side-grp>.side-btn{padding-left:18px}
.vmenu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.grp-dot{display:none;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.side-grp:not([open]).has-badge .grp-dot{display:inline-block}
:root[data-motion="off"] .side-grp>summary::after{transition:none}
.badge{margin-left:auto;background:var(--accent);color:#fff;border-radius:10px;padding:0 7px;font-size:11px}
.icon-btn{background:none;border:0;color:var(--mute);cursor:pointer;font-size:16px;padding:0 4px}
.icon-btn:hover{color:var(--text)}
#projlist{overflow:auto;flex:1;min-height:120px}
#sidemenu{overflow:auto;flex:0 1 auto;min-height:0}
.pdot{width:9px;height:9px;border-radius:50%;flex:none}
/* Hauptbereich */
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#topbar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
#pname{flex:0 0 200px;font-weight:600;font-size:15px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
#pgoal{flex:1 1 auto;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
#btnDelProj{flex:none}
#pname:focus,#pgoal:focus{outline:1px solid var(--accent)}
#palette{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.pal{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:grab;user-select:none}
.pal:hover{border-color:var(--accent)}
.hint{color:var(--mute);font-size:12px;margin-left:6px}
#vp{position:relative;flex:1;overflow:hidden;cursor:grab;touch-action:none;
  background-image:radial-gradient(var(--dotgrid) 1px,transparent 1px);background-size:24px 24px}
#vp.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#edges path.e{stroke:var(--edge);stroke-width:1.6;fill:none}
#edges path.hit{stroke:transparent;stroke-width:14;fill:none;pointer-events:stroke;cursor:pointer}
#edges path.hit:hover + path.e{stroke:var(--red)}
#edges path.tmp{stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4;fill:none}
.node{position:absolute;width:200px;height:86px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;cursor:move;user-select:none}
.node:hover{border-color:var(--hover)}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.n-head{display:flex;gap:10px;align-items:flex-start}
.n-ico{width:30px;height:30px;border-radius:9px;background:var(--chip);display:grid;place-items:center;font-weight:700;flex:none}
.n-txt{min-width:0;flex:1}
.n-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-role,.n-prov{color:var(--mute);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none;margin-top:4px}
.dot.run{background:var(--blue);animation:pulse 1s infinite}
.dot.paused{background:#666}
.dot.over{background:var(--red)}
.dot.wait{background:var(--orange)}
@keyframes pulse{50%{opacity:.35}}
.n-foot{position:absolute;left:12px;right:12px;bottom:8px;display:flex;gap:8px;align-items:center;font-size:11px;color:var(--mute)}
.n-bar{flex:1;height:3px;background:var(--chip);border-radius:2px;overflow:hidden}
.n-bar i{display:block;height:100%;background:var(--accent)}
.port{position:absolute;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;
  background:var(--chip);border:2px solid var(--edge)}
.port.top{top:-8px}
.port.bot{bottom:-8px;cursor:crosshair}
.port.bot:hover{border-color:var(--accent);background:var(--accent)}
.zoom{position:absolute;right:14px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
.zoom button{width:34px;height:30px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.zoom button:hover{border-color:var(--accent)}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);pointer-events:none;text-align:center}
/* Wachstumsleiste (Hyperstead) */
#growth{display:none;gap:12px;align-items:center;padding:7px 14px;border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 14%,var(--panel)),var(--panel) 70%)}
#growth.on{display:flex}
.g-stage{display:flex;align-items:center;gap:8px;min-width:0}
.g-ico{font-size:22px;line-height:1}
.g-name{font-weight:700;white-space:nowrap}
.g-sub{font-size:11px;color:var(--mute);white-space:nowrap}
.g-bar{flex:1 1 140px;min-width:80px;max-width:320px;height:8px;background:var(--chip);border-radius:5px;overflow:hidden}
.g-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s}
.g-stats{display:flex;gap:10px;font-size:12px;color:var(--mute);white-space:nowrap}
.g-stats b{color:var(--text)}
.g-tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.g-tools select{width:auto;padding:4px 8px}
.n-rank{font-size:12px;cursor:help}
/* Welt-Ansicht: Sonnensystem (immer dunkler Weltraum, auch im hellen Aussehen) */
#map{position:absolute;left:0;top:0;overflow:visible;display:none}
#app.view-world #map{display:block}
#app.view-world #edges,#app.view-world #nodes{display:none}
#app.view-world #vp,#app.view-atom #vp{background:radial-gradient(ellipse at 50% 45%,#0c1222,#05070e 60%,#020308) !important;background-size:100% 100% !important;background-position:0 0 !important}
#app.view-atom #vp{background:radial-gradient(ellipse at 50% 45%,#0b2230,#04121b 60%,#02080d) !important}
#map .star{opacity:.75}
#map .halo{opacity:.5}
#map .star.tw{animation:twinkle 4s ease-in-out infinite}
#map .gstar{fill:#dbe4ff;opacity:.22}
#map .nebula{opacity:.07;filter:blur(40px)}
#map .milky{opacity:.09;filter:blur(28px)}
#map .orbit{fill:none;stroke:#8fa3c0;stroke-opacity:.16;stroke-width:1}
#map .morbit{fill:none;stroke:#8fa3c0;stroke-opacity:.12;stroke-width:.8}
#map .pring{fill:none;stroke:#d9c8a6;stroke-opacity:.45}
#map .body{cursor:pointer}
#map .body:focus{outline:none}
#map .body:hover>circle:first-of-type{filter:brightness(1.2)}
#map .body.st-paused{opacity:.45}
#map .body.sel>circle:not(.corona):not(.sring){stroke:#fff;stroke-width:2}
#map .sring{fill:none;stroke-width:2.5}
#map .s-run{stroke:#60a5fa;animation:glow 1.6s ease-in-out infinite}
#map .s-appr{stroke:#facc15}
#map .s-fail{stroke:#ef4444}
#map .s-wait{stroke:#a78bfa;stroke-dasharray:3 3}
#map .sun .corona{animation:corona 5s ease-in-out infinite;transform-origin:0 0;transform-box:fill-box}
#map .sun.st-run .corona{animation-duration:1.8s}
#map .lbl{font:600 13px system-ui,sans-serif;fill:#dfe4ec;text-anchor:middle;paint-order:stroke;stroke:#070b1a;stroke-width:4px;stroke-linejoin:round}
#map .lbl2{font:11px system-ui,sans-serif;fill:#94a3b8;text-anchor:middle;paint-order:stroke;stroke:#070b1a;stroke-width:3px}
#map .mlbl{font:10px system-ui,sans-serif;fill:#cbd5e1;text-anchor:middle;paint-order:stroke;stroke:#070b1a;stroke-width:3px;pointer-events:none}
#map .state{font-size:22px;text-anchor:middle;fill:#fff}
#map .state.sm{font-size:15px}
@keyframes twinkle{50%{opacity:.35}}
@keyframes glow{50%{stroke-opacity:.25}}
@keyframes corona{50%{transform:scale(1.04);opacity:.85}}
@media (prefers-reduced-motion: reduce){#map .star.tw,#map .s-run,#map .sun .corona{animation:none}}
:root[data-motion="off"] #map .star.tw,:root[data-motion="off"] #map .s-run,:root[data-motion="off"] #map .sun .corona{animation:none}
/* Organigramm (drei Arten) */
#orgsvg{position:absolute;left:0;top:0;overflow:visible;display:none}
#app.view-org #orgsvg{display:block}
/* Atom (Molekül: Kugelgröße = Ebene, Stäbe = Vorgesetzte) */
#atomsvg{position:absolute;left:0;top:0;overflow:visible;display:none}
#app.view-atom #atomsvg{display:block}
#app.view-atom #edges,#app.view-atom #nodes{display:none}
#atomsvg .aorbit{fill:none;stroke:#7dd3fc;stroke-opacity:.28;stroke-width:1.4}
#atomsvg .abond{stroke:#cbd5e1;stroke-width:7;stroke-linecap:round;opacity:.75}
#atomsvg .abond2{stroke:#fff;stroke-width:2;stroke-linecap:round;opacity:.55}
#atomsvg .el.back{opacity:.85}
#hubsvg .abond{stroke:#cbd5e1;stroke-width:7;stroke-linecap:round;opacity:.75}
#hubsvg .abond2{stroke:#fff;stroke-width:2;stroke-linecap:round;opacity:.55}
#hubsvg .el.back{opacity:.85}
#hubsvg .el{cursor:pointer}#hubsvg .el.sel circle.core{stroke:#fff;stroke-width:2.5}
#hubsvg .albl{font:600 calc(12px * var(--lz,1)) system-ui,sans-serif;fill:#e0f2fe;text-anchor:middle;paint-order:stroke;stroke:#020617;stroke-width:3.5px;pointer-events:none}
#hubsvg .albl2{font:calc(10px * var(--lz,1)) system-ui,sans-serif;fill:#94a3b8;text-anchor:middle;paint-order:stroke;stroke:#020617;stroke-width:3px;pointer-events:none}
#hubsvg .nlbl{font:700 calc(15px * var(--lz,1)) system-ui,sans-serif;fill:#fff;text-anchor:middle;paint-order:stroke;stroke:#020617;stroke-width:4px;pointer-events:none}
#hubsvg .mbond{stroke:var(--hc,#7dd3fc);stroke-width:5;stroke-linecap:round;stroke-dasharray:2 9;opacity:.55}#hubsvg .mbond.live{opacity:.95;filter:url(#hubGlow)}
#hubsvg .veh.spark circle{fill:#fde68a;filter:url(#hubGlow)}
#atomsvg .el{cursor:pointer}
#atomsvg .el:focus{outline:none}
#atomsvg .el:focus-visible circle.core,#atomsvg .el.sel circle.core{stroke:#fff;stroke-width:2}
#atomsvg .nuc{cursor:pointer}
#atomsvg .albl{font:600 12px system-ui,sans-serif;fill:#e0f2fe;text-anchor:middle;paint-order:stroke;stroke:#020617;stroke-width:3.5px;pointer-events:none}
#atomsvg .albl2{font:10px system-ui,sans-serif;fill:#94a3b8;text-anchor:middle;paint-order:stroke;stroke:#020617;stroke-width:3px;pointer-events:none}
#atomsvg .nlbl{font:700 15px system-ui,sans-serif;fill:#fff;text-anchor:middle;paint-order:stroke;stroke:#020617;stroke-width:4px}
#orgReset{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:5;display:none}
#app.view-org #orgReset:not([hidden]){display:block}
#app.view-org #edges,#app.view-org #nodes{display:none}
/* Agenten-Leiste ist in jeder Grafik da (Wunsch ABI 2026-11-04); Hinweis und Ordnen passen sich an */
#palette .hint-org,#palette .hint-hub{display:none}#app.view-org #palette .hint-plan,#app.view-hub #palette .hint-plan{display:none}#app.view-org #palette .hint-org,#app.view-hub #palette .hint-hub{display:inline}
/* Grafik-Auswahl (aufklappbar) */
.vpick{position:relative}
#gViewBtn{white-space:nowrap}
/* Grafik-Menü in zwei Gruppen (Wunsch ABI 2026-11-04): Klassik und Modern */
.vmenu .vgrp{display:block;padding:8px 10px 3px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:700}
.vmenu .vsub{padding-left:18px}
.pnew{padding-bottom:0}.pnew .side-btn{border:1px dashed var(--line);color:var(--accent);font-weight:600;justify-content:center}
.pnew .side-btn:hover{border-color:var(--accent)}
.vmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:230px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:4px;box-shadow:0 10px 28px rgba(0,0,0,.28);display:flex;flex-direction:column}
.vmenu[hidden]{display:none}
.vmenu button{all:unset;box-sizing:border-box;display:block;padding:8px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;font-size:13px}
.vmenu button:hover,.vmenu button:focus-visible{background:var(--panel2);outline:none}
.vmenu button.on{background:var(--accent);color:#fff}
#orgsvg .ocard{cursor:pointer}
#orgsvg .ocard:focus{outline:none}
#orgsvg .ocard:focus-visible .obox,#orgsvg .ocard.sel .obox{stroke:var(--accent);stroke-width:2.5}
#orgsvg .ocard:hover .obox{stroke:var(--accent)}
#orgsvg .obox{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
#orgsvg .ohub{fill:var(--chip);stroke:var(--line)}
#orgsvg .oline{fill:none;stroke:var(--mute);stroke-opacity:.6;stroke-width:1.6}
#orgsvg .oring{fill:none;stroke:var(--line);stroke-dasharray:4 6}
#orgsvg .oname{font:600 13px system-ui,sans-serif;fill:var(--text)}
#orgsvg .orole{font:11px system-ui,sans-serif;fill:var(--mute)}
#orgsvg .oname.c,#orgsvg .orole.c{text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
#orgsvg .oini{font:700 13px system-ui,sans-serif;fill:var(--text);text-anchor:middle}
#orgsvg .opulse{animation:pulse 1.2s infinite}
:root[data-motion="off"] #orgsvg .opulse{animation:none}
@media (prefers-reduced-motion: reduce){#orgsvg .opulse{animation:none}}
#bcard{position:absolute;z-index:6;display:none;width:min(320px,calc(100% - 20px));background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);padding:12px}
#bcard.on{display:block}
#bcard h4{margin:0 0 2px;font-size:15px}
#bcard .mem{display:flex;gap:8px;align-items:center;width:100%;background:none;border:0;padding:6px;border-radius:8px;cursor:pointer;text-align:left;color:var(--text)}
#bcard .mem:hover{background:var(--panel2)}
#bcard .mem small{color:var(--mute);margin-left:auto}
/* Moderne Ebene „Alle Firmen“ (Stadt/Kosmos): immer dunkel mit Leuchtkanten, eigenes SVG, Umschalter oben, Infofenster rechts */
#hubsvg{position:absolute;left:0;top:0;overflow:visible;display:none;--hrot:0}
/* Drehen und Neigen der modernen Welten (Wunsch ABI 2026-11-04): Beschriftungen drehen sich zurueck und bleiben lesbar */
#hubsvg text{transform-box:view-box;transform:rotate(calc(var(--hrot) * -1deg))}#hubsvg .hlogo{transform-box:fill-box;transform-origin:center;transform:rotate(calc(var(--hrot) * -1deg))}
.zoom .cam{display:none}#app.view-hub .zoom .cam{display:block}
#vp.turning{cursor:grabbing}
#hubbar{display:none;position:absolute;left:50%;transform:translateX(-50%);top:10px;z-index:5;max-width:calc(100% - 20px)}
#hubbar .seg{display:inline-flex;border:1px solid #2b3a5c;border-radius:12px;overflow:hidden;background:rgba(10,16,34,.85);box-shadow:0 6px 24px rgba(0,0,0,.45);backdrop-filter:blur(8px)}
#hubbar .seg button{background:none;border:0;padding:8px 14px;cursor:pointer;color:#cbd5e1;font-size:14px;white-space:nowrap}
#hubbar .seg button+button{border-left:1px solid #2b3a5c}
#hubbar .seg button:hover{background:#16223f}
#hubbar .seg button.on{background:linear-gradient(180deg,#2563eb,#1d4ed8);color:#fff;box-shadow:inset 0 0 12px rgba(147,197,253,.45)}
#hubcard{position:absolute;z-index:6;display:none;right:12px;top:64px;width:min(320px,calc(100% - 24px));max-height:calc(100% - 80px);overflow:auto;
  background:rgba(10,16,34,.92);color:#e2e8f0;border:1px solid #2b3a5c;border-radius:14px;padding:14px;box-shadow:0 12px 36px rgba(0,0,0,.5);backdrop-filter:blur(10px)}
#hubcard.on{display:block}#app:not(.view-hub) #hubcard{display:none}
#hubcard h4{margin:0 26px 4px 0;font-size:16px}
#hubcard .hc-x{position:absolute;right:8px;top:8px;color:#94a3b8}
#hubcard .hc-sub{color:#94a3b8;font-size:12.5px}
#hubcard .hc-goal{font-size:13px;margin-top:6px;color:#cbd5e1}
#hubcard .hc-h{margin:12px 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#64748b}
#hubcard .hc-ag{display:flex;gap:8px;align-items:center;width:100%;background:none;border:0;padding:6px 8px;border-radius:8px;cursor:pointer;color:#e2e8f0;text-align:left;font-size:13.5px}
#hubcard .hc-ag:hover{background:#16223f}
#hubcard .hc-ag small{margin-left:auto;color:#94a3b8}
#hubcard .hc-ag .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;flex:none}
#hubcard .hc-ag .dot.run{background:#38bdf8 !important;background:#38bdf8;box-shadow:0 0 8px #38bdf8}
#hubcard .hc-btns{margin-top:12px;display:flex;gap:8px}
#hubcard .hc-btns .btn{background:#1d4ed8;border-color:#3b82f6;color:#fff}
#hubsvg .lbls{pointer-events:none}
#hubcard i{color:#64748b;font-size:13px;padding:0 8px}
#hubbar .hubrow{display:flex;gap:6px;justify-content:center;margin-top:6px}
#hubOut{display:none;white-space:nowrap;background:rgba(10,16,34,.9);border-color:#2b3a5c;color:#e2e8f0}
#app.hub-in #hubOut{display:inline-flex}
#hubFind{position:relative}
#hubSearch{width:230px;background:rgba(10,16,34,.9);border:1px solid #2b3a5c;color:#e2e8f0;border-radius:10px;padding:6px 10px;font-size:13px}
#hubResults{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:rgba(10,16,34,.97);border:1px solid #2b3a5c;border-radius:10px;padding:4px;display:flex;flex-direction:column;z-index:9;max-height:300px;overflow:auto}
#hubResults[hidden]{display:none}
#hubResults .hr{background:none;border:0;color:#e2e8f0;text-align:left;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13px;display:flex;flex-direction:column}
#hubResults .hr:hover,#hubResults .hr:focus{background:#16223f}
#hubResults small,.hr-none{color:#94a3b8;font-size:11.5px}
.hr-none{padding:6px 8px}

.ops-tile:disabled{cursor:default}
.ops-tile:not(:disabled):hover{border-color:var(--accent)}
.ops-tile span{font-size:18px}.ops-tile b{font-size:20px}.ops-tile small{color:var(--mute);font-size:11px;text-align:center}
.ops-cost{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:10px;margin-bottom:12px}
.ops-cost button{margin-left:auto}
.ops-sec{margin:14px 0 4px}.ops-sec h4{margin:0 0 6px;font-size:14px}
.ops-n{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--chip);color:var(--mute);font-size:11px;text-align:center}
.ops-row{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.ops-row .chip{flex:none;margin-top:1px}
.ops-main{flex:1;min-width:0;word-break:break-word}.ops-main small{display:block;color:var(--mute);font-size:12px}
.ops-main a{color:var(--accent)}
.ops-err{margin-top:3px;font-size:12px;color:var(--mute);white-space:pre-wrap;max-height:4.5em;overflow:hidden}
.ops-empty{color:var(--mute);font-size:12px}
#gStats{cursor:pointer}

/* Feier beim Aufstieg */
#party{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);overflow:hidden;padding:16px}
#party.on{display:flex}
#party i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;opacity:.9;animation:fall 2.8s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(540deg);opacity:.6}}
.party-card{position:relative;max-width:340px;width:100%;text-align:center;background:var(--panel);color:var(--text);border:2px solid var(--accent);border-radius:16px;padding:20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:8px;align-items:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.party-card b{font-size:18px}.party-card div{color:var(--mute);font-size:13px}
.party-card .party-ico{font-size:56px;line-height:1;color:inherit}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@media (prefers-reduced-motion: reduce){#party i{display:none}.party-card{animation:none}#growth .g-bar i{transition:none}}
:root[data-motion="off"] #party i{display:none}
:root[data-motion="off"] .party-card{animation:none}
:root[data-motion="off"] #growth .g-bar i{transition:none}
/* Barrierefreiheit: sichtbarer Tastatur-Fokus */
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,select:focus-visible,input[type=checkbox]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#map .body:focus-visible{outline:none;filter:drop-shadow(0 0 3px var(--accent)) drop-shadow(0 0 6px var(--accent))}

/* Postkorb */
.inbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.inbar label{display:flex;gap:6px;align-items:center;cursor:pointer;margin-right:auto;font-size:13px}
.insel{display:inline-flex;align-items:center;margin-right:6px;cursor:pointer;vertical-align:middle}
.insel input,.inbar input{width:18px;height:18px;margin:0}
.fgrp{margin:0 0 12px}
.fgrp-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 8px;margin-bottom:4px;border-bottom:1px solid var(--line)}
/* Anleitung + Hinweise */
.help-search{width:100%;margin-bottom:10px}
.help-sec{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel2)}
.help-sec summary{cursor:pointer;padding:10px 12px;font-weight:600;list-style:none}
.help-sec summary::-webkit-details-marker{display:none}
.help-sec summary::before{content:'▸ ';color:var(--accent)}
.help-sec[open] summary::before{content:'▾ '}
.help-sec .hb{padding:0 12px 10px;font-size:14px;line-height:1.5}
.help-sec .hb p{margin:6px 0}.help-sec .hb ul{margin:6px 0;padding-left:20px}
.help-sec .hb code{background:var(--chip);padding:0 4px;border-radius:4px}
.help-sec mark{background:var(--accent);color:#fff;border-radius:3px}
#tipbox{position:fixed;z-index:95;display:none;max-width:min(300px,calc(100vw - 24px));background:#1b1f27;color:#fff;border:1px solid var(--accent);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#tipbox.on{display:block}
#helpbar{position:fixed;z-index:94;left:50%;bottom:12px;transform:translateX(-50%);display:none;gap:8px;align-items:center;width:min(420px,calc(100vw - 24px));background:var(--panel);border:2px solid var(--accent);border-radius:12px;padding:6px 10px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
:root[data-helpmode="on"] #helpbar{display:flex}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><img class="logo" src="/static/logo/hyperstead-192.png" alt=""><b>Hyperstead</b></div>
    <div class="side-sec" id="sidemenu">
      <button class="side-btn" id="btnHelp" title="Guide: how Hyperstead works, chapters with search, plus the help mode for phones">📖 Guide</button>
      <details class="side-grp" data-grp="arbeit" open>
        <summary title="Mail, approvals, running work, goals and schedule (tap to expand or collapse)">📬 Daily business<span class="grp-dot" aria-hidden="true"></span></summary>
        <button class="side-btn" id="btnInbox">📬 Mail <span class="badge" id="inbadge" style="display:none">0</span></button>
        <button class="side-btn" id="btnApprovals">✋ Approvals <span class="badge" id="apbadge" style="display:none">0</span></button>
        <button class="side-btn" id="btnOps" title="What is running, waiting or went wrong, and what it costs today">🛰 Operations center</button>
        <button class="side-btn" id="btnGoals" title="Goals and sub-goals of the project with progress">🎯 Goals</button>
        <button class="side-btn" id="btnSched" title="Business hours of the company and daily tasks per employee">🕘 Schedule <span class="badge" id="schbadge" style="display:none">closed</span></button>
      </details>
      <details class="side-grp" data-grp="team">
        <summary title="AI models of the agents and company knowledge (tap to expand or collapse)">🤖 Team &amp; AI<span class="grp-dot" aria-hidden="true"></span></summary>
        <button class="side-btn" id="btnGroupAI" title="Select several agents and switch them to one AI / model together">🔀 AI for group</button>
        <button class="side-btn" id="btnModels" title="Switch agents whose AI model no longer exists to another one">⚠ Models <span class="badge" id="mdbadge" style="display:none">0</span></button>
        <button class="side-btn" id="btnKnow" title="What all agents of this project should always know">🧠 Company knowledge</button>
      </details>
      <details class="side-grp" data-grp="daten">
        <summary title="Project files, cloud upload and webhooks (tap to expand or collapse)">📁 Files &amp; connections<span class="grp-dot" aria-hidden="true"></span></summary>
        <button class="side-btn" id="btnFiles">📁 Files of this project</button>
        <button class="side-btn" id="btnCloud" title="GitHub, Google Drive, OneDrive and Telegram: where files are uploaded">☁️ Cloud</button>
        <button class="side-btn" id="btnPrint" title="Choose the printer for the evening reports and allow or block printing">🖨 Printer</button>
        <button class="side-btn" id="btnConn" title="Webhooks: agents call your services, orders come in from outside">🔌 Connections</button>
      </details>
      <details class="side-grp" data-grp="auswertung">
        <summary title="Costs and history (tap to expand or collapse)">📊 Reports<span class="grp-dot" aria-hidden="true"></span></summary>
        <button class="side-btn" id="btnUsage" title="Calls, tokens and estimated costs per project, agent and model">📊 Usage &amp; costs</button>
        <button class="side-btn" id="btnAudit">📜 History (audit log)</button>
      </details>
        <button class="side-btn" id="btnLogout" style="display:none" onclick="location.href='/logout'">🚪 Log out</button>
    </div>
    <div class="side-h"><span>Projects</span></div>
    <div class="side-sec pnew"><button class="side-btn" id="btnNewProj" title="Create a new project: empty or as a ready-made company from a template (web agency, accounting, retail …)">＋ New project</button></div>
    <div id="projlist" class="side-sec"></div>
  </aside>

  <div id="sideBack"></div>
  <section id="main">
    <div id="topbar">
      <button class="icon-btn" id="btnMenu" title="Menu">☰</button>
      <input id="pname" type="text" placeholder="Project name" disabled>
      <input id="pgoal" type="text" placeholder="Project goal (all agents know it)" disabled>
      <button class="btn danger sm" id="btnDelProj" style="display:none">Delete project</button>
    </div>
    <div id="growth" aria-live="polite">
      <div class="g-stage"><span class="g-ico" id="gIco"></span><div><div class="g-name" id="gName"></div><div class="g-sub" id="gSub"></div></div></div>
      <div class="g-bar" title="Progress to the next stage"><i id="gBar"></i></div>
      <div class="g-stats" id="gStats"></div>
      <div class="g-tools">
        <button class="icon-btn" id="gBack" disabled title="Back to the previous graphic (same design, no switch to another view)" aria-label="Back to the previous graphic">←</button>
        <div class="vpick" id="gViews">
          <button class="btn sm" id="gViewBtn" aria-haspopup="true" aria-expanded="false" aria-controls="gViewMenu" title="Choose a graphic: Classic (three org charts, blueprint) or Modern (all companies as city, cosmos or molecules)"><span id="gViewLbl">Org chart: Tree</span> ▾</button>
          <div class="vmenu" id="gViewMenu" role="menu" aria-label="Graphic" hidden>
            <span class="vgrp">Classic</span>
            <button role="menuitemradio" class="vsub" data-view="org" data-org="baum" title="Org chart as a tree from top to bottom">Org chart: Tree</button>
            <button role="menuitemradio" class="vsub" data-view="org" data-org="gliederung" title="Org chart as an outline, one line per agent (good on phones)">Org chart: Outline</button>
            <button role="menuitemradio" class="vsub" data-view="org" data-org="kreis" title="Org chart as a circle: management in the middle, each level a ring">Org chart: Circle</button>
            <button role="menuitemradio" class="vsub" data-view="plan" title="Blueprint: create, move and connect agents">Blueprint</button>
            <hr>
            <span class="vgrp">Modern</span>
            <button role="menuitemradio" class="vsub" data-view="hub" data-hubworld="stadt" title="All companies as a city: each company a building, roads only where they collaborate">🏙 City (all companies)</button>
            <button role="menuitemradio" class="vsub" data-view="hub" data-hubworld="kosmos" title="All companies as a cosmos: each company a solar system, spaceships only where they collaborate">🌌 Cosmos (all companies)</button>
            <button role="menuitemradio" class="vsub" data-view="hub" data-hubworld="molekuel" title="All companies as molecules: each company its own molecule, partners linked by bonds">🧬 Molecule (all companies)</button>
          </div>
        </div>
        <button class="icon-btn" id="gTheme" title="Switches between light and dark appearance (applies to this device)">🌓</button>
        <button class="icon-btn" id="gInfo" title="How growth works">ⓘ</button>
      </div>
    </div>
    <div id="palette">
      <span style="color:var(--mute)">Add agent (drag or click):</span>
    </div>
    <div id="vp">
      <div class="zoom"><button id="zin" title="Zoom in" aria-label="Zoom in">+</button><button id="zout" title="Zoom out" aria-label="Zoom out">−</button><button id="zfit">Fit</button><button class="cam" id="hRotL" title="Rotate left (also: drag with the right mouse button or rotate with two fingers)" aria-label="Rotate left">⟲</button><button class="cam" id="hRotR" title="Rotate right" aria-label="Rotate right">⟳</button><button class="cam" id="hTiltUp" title="Tilt more (also: drag up/down with the right mouse button or move two fingers together)" aria-label="Tilt more">⤵</button><button class="cam" id="hTiltDn" title="Tilt less" aria-label="Tilt less">⤴</button><button class="cam" id="hCam0" title="Straighten: reset rotation and tilt" aria-label="Straighten">⌂</button></div>
      <div id="world"><svg id="map" width="1" height="1"></svg><svg id="orgsvg" width="1" height="1"></svg><svg id="atomsvg" width="1" height="1"></svg><svg id="hubsvg" width="1" height="1"></svg><svg id="edges"></svg><div id="nodes"></div></div>
      <div id="hubbar" role="toolbar" aria-label="Choose view">
        <span class="hubrow"><button class="btn sm" id="hubLink" title="Collaboration: link two companies as partners or separate them. Delivery vans drive or spaceships fly between partners">🤝 Collaboration</button><button class="btn sm" id="hubOut" title="Leave the company, back to all companies (Esc)">← All companies</button>
        <span id="hubFind"><input id="hubSearch" type="search" placeholder="🔍 Search company or agent" aria-label="Search company or agent" autocomplete="off"><span id="hubResults" hidden></span></span></span>
      </div>
      <nav id="hubdeps" aria-label="Departments"></nav>
      <div id="hubcard" role="dialog" aria-label="Company"></div>
      <div id="bcard" role="dialog" aria-label="Celestial body"></div>
      <div id="wlist"></div>
      <button class="btn sm" id="orgReset" hidden title="Rearrange cards moved by hand in this org chart">↺ Reset layout</button>
      <div class="empty" id="empty">Choose a project on the left or create one with “＋ New project”.</div>
    </div>
  </section>

  <aside id="panel">
    <div class="p-head"><b id="ptitle">Agent</b><button class="icon-btn" id="pclose">✕</button></div>
    <div class="tabs">
      <button class="tab on" data-tab="set">Settings</button>
      <button class="tab" data-tab="chat">💬 Chat</button>
      <button class="tab" data-tab="tasks">Tasks</button>
      <button class="tab" data-tab="log">History</button>
    </div>
    <div class="p-body" id="pbody"></div>
  </aside>
</div>

<div id="ov"><div id="ovbox" role="dialog" aria-modal="true" aria-labelledby="ovtitle"><header><b id="ovtitle"></b><button class="icon-btn" id="ovhelp" title="Open the matching chapter of the guide for this window" aria-label="Help for this window" style="display:none">ⓘ</button><button class="icon-btn" id="ovclose" title="Close" aria-label="Close">✕</button></header><div id="ovbody"></div></div></div>
<div id="livebar" title="Running AI requests. Slow models (Ollama on the Pi) often need many minutes; the answer still arrives."></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="tipbox" role="tooltip"></div>
<div id="helpbar">❓ Help mode: tap a button for its explanation, tap again to use it. <button class="btn sm" id="helpoff" title="Turn off help mode">Off</button></div>
<div id="party" role="alert" aria-live="assertive"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const W = 200, H = 86;
const COLORS = ['#ec4899','#3b82f6','#22c55e','#a855f7','#f59e0b','#06b6d4'];
const STATUS = {todo:'Open',queued:'Queued',running:'Running',waiting_subtasks:'Waiting for team',waiting_approval:'Needs approval',done:'Done',failed:'Error',blocked:'Blocked'};
const fmtTok = n => n>=1000 ? (n/1000).toFixed(1)+'k Tok' : n+' Tok';
const MGR = {delegate:true,judge:true,auto_run:true};

const TPL = {
  ceo:{name:'CEO',role:'Chief Executive Officer',perms:{...MGR,recruit:true},
    prompt:'You run the company. Break the project goal down into clear assignments, distribute them to the right employees, review their reports critically and send back insufficient work with concrete feedback. Your final result summarizes everything clearly. Answer in the language of the assignment.'},
  cto:{name:'CTO',role:'Chief Technology Officer',perms:MGR,
    prompt:'You are responsible for technology. Plan the implementation, distribute programming tasks, check the results for correctness and completeness and send back defects. Answer in the language of the assignment.'},
  lead:{name:'Team lead',role:'Team lead',perms:MGR,
    prompt:'You lead a team. Split your assignment into subtasks for your employees, review their reports and combine them into a clean result for your manager. Answer in the language of the assignment.'},
  dev:{name:'Developer',role:'Software Engineer',perms:{write_files:true,code:true},
    prompt:'You write clean, working code with short comments, in the language the assignment asks for (default: Python). Save code with write_code, check it with check_code and fix errors until the check passes. Briefly explain what you did.'},
  mkt:{name:'Marketing',role:'Chief Marketing Officer',perms:{write_files:true},
    prompt:'You develop copy, ideas and campaigns. Write concretely and concisely, in the language of the assignment.'},
  res:{name:'Research',role:'Researcher',perms:{},
    prompt:'You collect facts and summarize them in a structured way. Mark uncertain things as uncertain.'},
  custom:{name:'New agent',role:'',perms:{},prompt:''}
};
const PAL = [['ceo','👑 CEO'],['cto','🧠 CTO'],['lead','👥 Team lead'],['dev','</> Developer'],['mkt','📣 Marketing'],['res','🔎 Research'],['custom','＋ Blank']];

const S = {projects:[], pid:null, graph:null, sel:null, providers:[], tab:'set', openTasks:new Set(), logs:[], info:{auth:false,allow_shell:false,allow_cli:false}};
const V = {x:80,y:40,s:1};
let drag = null;

async function api(path, method='GET', body){
  const r = await fetch('/api'+path,{method,headers:{'Content-Type':'application/json','X-PCL':'1'},body:body!==undefined?JSON.stringify(body):undefined});
  if(r.status===401){ location.href='/login'; throw new Error('Session expired'); }
  if(!r.ok){ const t = await r.text(); toast(t.slice(0,300)||('Error '+r.status)); throw new Error(t); }
  return r.json();
}
const fmtDur = s => s<60 ? s+' s' : Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+' min';
function renderLive(live){  // Hinweis unten links: welche KI gerade schreibt und wie lange schon
  const el=$('#livebar'); if(!el) return;
  live=live||[]; if(!live.length){ el.style.display='none'; el.innerHTML=''; return; }
  const lab=id=>((S.providers||[]).find(p=>p.id===id)||{}).label||id;
  el.innerHTML=live.slice(0,4).map(x=>'<div>⏳ <b>'+esc(x.agent||'Agent')+'</b> · '+esc(lab(x.provider))+' · '+fmtDur(x.secs)
    +(x.provider==='ollama'?(x.chars?' · '+x.chars+' characters':' · loading model / reading task'):' · waiting for answer')+'</div>').join('')
    +(live.length>4?'<div>… and '+(live.length-4)+' more</div>':'');
  el.style.display='block';
}
function toast(t){ const el=$('#toast'); el.textContent=t; el.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>el.style.display='none',4500); }
const fmt = ts => new Date(ts*1000).toLocaleString(undefined,{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});

/* ---------- Projekte ---------- */
async function loadProjects(){
  S.projects = await api('/projects');
  const el = $('#projlist'); el.innerHTML='';
  S.projects.forEach((p,i)=>{
    const b = document.createElement('button');
    b.className = 'side-btn'+(p.id===S.pid?' active':'');
    b.innerHTML = `<span class="pdot" style="background:${COLORS[i%COLORS.length]}"></span><span>${esc(p.name)}</span>${p.stage_icon?`<span style="margin-left:auto" title="${esc(p.stage_name||'')}">${p.stage_icon}</span>`:''}`;
    b.onclick = ()=>openProject(p.id);
    el.appendChild(b);
  });
}
async function openProject(id){
  S.pid = id; S.sel = null; closePanel(); WORLD.g = null; WORLD.at = 0;
  if(VIEW==='hub' && HUB.inside && HUB.inside!==id){ HUB.inside=null; HUB.dep=null; HUB.agent=null; HUB.sig=''; $('#hubcard').classList.remove('on'); $('#app').classList.remove('hub-in'); drawHub(); }
  await loadProjects(); await refresh(true);
  fit();
  if(VIEW==='hub'){ hubMarkCur(); hubShowCur(); }
  gNote();
}
$('#btnNewProj').onclick = ()=>newProjectDialog();
$('#btnDelProj').onclick = async ()=>{
  if(!S.pid || !confirm('Delete the project with all agents and tasks? (The audit log and the files in the project folder are kept)')) return;
  await api('/projects/'+S.pid,'DELETE'); S.pid=null; S.graph=null; S.sel=null; closePanel();
  await loadProjects(); render();
};
$('#pname').onchange = e=> S.pid && api('/projects/'+S.pid,'PUT',{name:e.target.value}).then(loadProjects);
$('#pgoal').onchange = e=> S.pid && api('/projects/'+S.pid,'PUT',{goal:e.target.value});

/* ---------- Daten + Rendering ---------- */
async function refresh(force){
  if(!S.pid || (drag && !force)) return;
  try{ S.graph = await api('/projects/'+S.pid+'/graph'); }catch(e){ return; }
  const n = S.graph.pending_approvals;
  const b = $('#apbadge'); b.textContent = n; b.style.display = n? '' : 'none';
  const ni = S.graph.inbox_new||0;
  const ib = $('#inbadge'); ib.textContent = ni; ib.style.display = ni? '' : 'none';
  const nm = S.graph.model_problems||0;
  const mb = $('#mdbadge'); mb.textContent = nm; mb.style.display = nm? '' : 'none';
  $('#schbadge').style.display = S.graph.closed ? '' : 'none';
  renderLive(S.graph.live);
  sideDots();
  render(); renderGrowth(); loadGrowth(force);
  if(S.sel && S.tab==='tasks') loadTasks();
  if(VIEW==='plan' && !drag) untangle();
}
const UNTANGLED = new Set();
function untangle(){  // Bauplan: liegen Agenten aufeinander (z. B. alle auf 0,0), einmal je Projekt automatisch ordnen
  const as=S.graph.agents; if(as.length<2 || UNTANGLED.has(S.pid)) return;
  let hits=0;
  for(let i=0;i<as.length;i++) for(let j=i+1;j<as.length;j++) if(Math.abs(as[i].x-as[j].x)<W*.5 && Math.abs(as[i].y-as[j].y)<H*.5) hits++;
  if(!hits) return;
  UNTANGLED.add(S.pid); autoLayout().then(()=>toast('Some agents were lying on top of each other. The blueprint was arranged automatically.'));
}
function agentById(id){ return S.graph && S.graph.agents.find(a=>a.id===id); }

function render(){
  const g = S.graph;
  $('#empty').style.display = g ? 'none' : 'grid';
  $('#pname').disabled = $('#pgoal').disabled = !g;
  $('#btnDelProj').style.display = g ? '' : 'none';
  if(!g){ $('#growth').classList.remove('on'); $('#nodes').innerHTML=''; $('#edges').innerHTML=''; $('#pname').value=''; $('#pgoal').value=''; return; }
  if(document.activeElement!==$('#pname')) $('#pname').value = g.project.name;
  if(document.activeElement!==$('#pgoal')) $('#pgoal').value = g.project.goal;
  const nodes = $('#nodes'); nodes.innerHTML='';
  g.agents.forEach(a=>{
    const el = document.createElement('div');
    el.className = 'node'+(a.id===S.sel?' sel':'');
    el.dataset.id = a.id; el.style.left=a.x+'px'; el.style.top=a.y+'px';
    const c = a.counts||{}; const running = (c.running||0)+(c.queued||0)+(c.waiting_subtasks||0);
    const cls = a.paused?'paused':(c.waiting_approval?'wait':running?'run':'');
    const prov = a.provider ? ((S.providers.find(p=>p.id===a.provider)||{}).label || a.provider) : '⚠ no AI yet';
    el.innerHTML = `<div class="port top"></div>
      <div class="n-head"><div class="n-ico">${esc((a.name||'?')[0].toUpperCase())}</div>

function drawEdges(){
  const svg = $('#edges'); let h='';
  S.graph.agents.forEach(a=>{
    if(!a.parent_id) return; const p = agentById(a.parent_id); if(!p) return;
    const x1=p.x+W/2,y1=p.y+H,x2=a.x+W/2,y2=a.y,my=(y1+y2)/2;
    const d=`M${x1},${y1} V${my} H${x2} V${y2}`;
    h+=`<path class="hit" data-child="${a.id}" d="${d}"><title>Click to disconnect</title></path><path class="e" d="${d}"/>`;
  });

async function autoLayout(){
  const ag=S.graph.agents, ids=new Set(ag.map(a=>a.id)), kids={};
  ag.forEach(a=>{ if(a.parent_id && ids.has(a.parent_id)) (kids[a.parent_id]=kids[a.parent_id]||[]).push(a); });
  const G=30, ROW=H+34, COLS=5, pos={};
  function width(a){ const k=kids[a.id]||[]; if(!k.length) return W+G;
    if(k.every(c=>!(kids[c.id]||[]).length) && k.length>COLS) return COLS*(W+G);
    return Math.max(W+G, k.reduce((s,c)=>s+width(c),0)); }
  function place(a,x0,y){ const k=kids[a.id]||[], w=width(a);
    pos[a.id]={x:Math.round(x0+w/2-W/2),y};
    if(!k.length) return;
    if(k.every(c=>!(kids[c.id]||[]).length) && k.length>COLS){
      k.forEach((c,i)=>{ const r=Math.floor(i/COLS), col=i%COLS, inRow=Math.min(COLS,k.length-r*COLS);
        pos[c.id]={x:Math.round(x0+w/2-inRow*(W+G)/2+col*(W+G)+G/2), y:y+H+60+r*ROW}; });
    } else { let x=x0; k.forEach(c=>{ place(c,x,y+H+70); x+=width(c); }); }
  }
  let x=0; ag.filter(a=>!a.parent_id||!ids.has(a.parent_id)).forEach(r=>{ place(r,x,40); x+=width(r)+G; });
  await Promise.all(ag.map(a=>api('/agents/'+a.id,'PUT',pos[a.id]||{})));
  await refresh(true); V.x=40; V.y=30; V.s=Math.min(1, ($('#vp').clientWidth-80)/Math.max(x,1)); applyView();
}

async function uploadFile(f,dir){

/* ---------- Ansicht (Pan/Zoom) ---------- */
function applyView(){
  $('#world').style.transform = `translate(${V.x}px,${V.y}px) scale(${V.s})`;
  $('#world').style.setProperty('--lz', Math.min(HUB.inside?1.25:2, Math.max(1, .9/V.s)).toFixed(2));  // lesbar beim Herauszoomen, im Innern höchstens 1,25
  const vp=$('#vp'); vp.style.backgroundSize=`${24*V.s}px ${24*V.s}px`; vp.style.backgroundPosition=`${V.x}px ${V.y}px`;
}
function toWorld(cx,cy){ const r=$('#vp').getBoundingClientRect(); return {x:(cx-r.left-V.x)/V.s, y:(cy-r.top-V.y)/V.s}; }
function zoomAt(f,cx,cy){
  const r=$('#vp').getBoundingClientRect(); const mx=cx-r.left,my=cy-r.top;
  const ns=Math.min(2,Math.max(.3,V.s*f)); V.x=mx-(mx-V.x)*(ns/V.s); V.y=my-(my-V.y)*(ns/V.s); V.s=ns; applyView();
}
function fit(){
  if(VIEW==='hub'){ const vp=$('#vp').getBoundingClientRect(), top=$('#hubbar').offsetHeight+16; let b=HUB.box; if(!b) return;
    const c=hubCam(); if(c.rot||c.tilt){  // gedreht/geneigt: Umriss der gedrehten Flaeche einpassen
      const a=c.rot*Math.PI/180, cx=(b.x0+b.x1)/2, cy=(b.y0+b.y1)/2, w=(b.x1-b.x0)/2, h=(b.y1-b.y0)/2;
      const W2=Math.abs(w*Math.cos(a))+Math.abs(h*Math.sin(a)), H2=(Math.abs(w*Math.sin(a))+Math.abs(h*Math.cos(a)))*Math.cos(c.tilt*Math.PI/180);
      b={x0:cx-W2,x1:cx+W2,y0:cy-H2,y1:cy+H2}; }
    const wide=vp.width>820, L=wide&&HUB.inside?226:0, Rt=wide&&$('#hubcard').classList.contains('on')?346:0, aw=vp.width-L-Rt;
    const s=Math.min(1.2,Math.max(.2,Math.min((aw-30)/(b.x1-b.x0),(vp.height-top-20)/(b.y1-b.y0))));
    V.s=s; V.x=L+(aw-(b.x1-b.x0)*s)/2-b.x0*s; V.y=top+(vp.height-top-(b.y1-b.y0)*s)/2-b.y0*s; return applyView(); }
  if(VIEW==='org' && ORG.box){ const vp=$('#vp').getBoundingClientRect(), b=ORG.box, top=50;
    const fw=(vp.width-30)/(b.x1-b.x0), fh=(vp.height-top-20)/(b.y1-b.y0);  // Gliederung: nur nach Breite, nach unten wird geblaettert
    const s=Math.min(1.1,Math.max(.3, ORG.style==='gliederung' ? fw : Math.min(fw,fh)));
    V.s=s; V.x=(vp.width-(b.x1-b.x0)*s)/2-b.x0*s; V.y = ORG.style==='kreis' ? top+(vp.height-top-(b.y1-b.y0)*s)/2-b.y0*s : top-b.y0*s; return applyView(); }
  if(VIEW==='atom' && ATOM.box){ const vp=$('#vp').getBoundingClientRect(), b=ATOM.box;
    const s=Math.min(1.1,Math.max(.25,Math.min((vp.width-40)/(b.x1-b.x0),(vp.height-40)/(b.y1-b.y0))));
    V.s=s; V.x=(vp.width-(b.x1-b.x0)*s)/2-b.x0*s; V.y=(vp.height-(b.y1-b.y0)*s)/2-b.y0*s; return applyView(); }
  if(VIEW==='world' && MAP.box){ const vp=$('#vp').getBoundingClientRect(), b=MAP.box;
    const s=Math.min(1.1,Math.max(.3,Math.min((vp.width-40)/(b.x1-b.x0),(vp.height-40)/(b.y1-b.y0))));
    V.s=s; V.x=(vp.width-(b.x1-b.x0)*s)/2-b.x0*s; V.y=(vp.height-(b.y1-b.y0)*s)/2-b.y0*s; return applyView(); }
  const vp=$('#vp').getBoundingClientRect(); const as=S.graph?S.graph.agents:[];
  if(!as.length){ V.x=80;V.y=40;V.s=1; return applyView(); }
  const x0=Math.min(...as.map(a=>a.x)),y0=Math.min(...as.map(a=>a.y));
  const x1=Math.max(...as.map(a=>a.x+W)),y1=Math.max(...as.map(a=>a.y+H));
  const s=Math.min(1.2,Math.max(.3,Math.min((vp.width-80)/(x1-x0),(vp.height-80)/(y1-y0))));
  V.s=s; V.x=(vp.width-(x1-x0)*s)/2-x0*s; V.y=(vp.height-(y1-y0)*s)/2-y0*s; applyView();
}

/* ---------- Maus: Pan / Knoten ziehen / verbinden ---------- */
const touches=new Map(); let pinch=null;  // Touch: zwei Finger = zoomen
$('#vp').addEventListener('pointerdown',e=>{
  if(e.target.closest('.zoom')) return;
  if(e.pointerType==='touch'){
    touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(touches.size===2){
      if(drag&&drag.type==='link'){ const t=$('#tmp'); if(t) t.remove(); }
      drag=null; const [a,b]=[...touches.values()];
      pinch={d:Math.hypot(a.x-b.x,a.y-b.y), ang:Math.atan2(b.y-a.y,b.x-a.x), my:(a.y+b.y)/2}; return;
    }
    if(touches.size>2) return;
  }
  const port = e.target.closest('.port.bot'); const node = e.target.closest('.node');
  if(port && node){
    e.preventDefault();
    const id=+node.dataset.id; const a=agentById(id);
    drag={type:'link',from:id,x1:a.x+W/2,y1:a.y+H};
    const p=document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('class','tmp'); p.id='tmp'; $('#edges').appendChild(p);
    return;
  }
  if(node){
    e.preventDefault();
    const id=+node.dataset.id; const a=agentById(id); const w=toWorld(e.clientX,e.clientY);
    drag={type:'node',id,el:node,dx:w.x-a.x,dy:w.y-a.y,x0:a.x,y0:a.y,moved:false};
    selectAgent(id,true); return;
  }
  const oc = VIEW==='org' && e.target.closest('#orgsvg .ocard');
  if(oc){  // Organigramm: Karte verschieben (nur Ansicht, gespeichert je Geraet)
    const id=+oc.dataset.agent, o=orgOff()[id]||[0,0];
    drag={type:'org', id, sx:e.clientX, sy:e.clientY, o0:o, moved:false}; return;
  }
  if(e.target.closest('#edges path.hit')) return;
  if(VIEW==='hub' && e.pointerType!=='touch' && (e.button===2 || e.shiftKey)){ e.preventDefault(); drag={type:'turn',sx:e.clientX,sy:e.clientY}; $('#vp').classList.add('turning'); return; }
  drag={type:'pan',sx:e.clientX,sy:e.clientY,vx:V.x,vy:V.y}; $('#vp').classList.add('panning');
});
window.addEventListener('pointermove',e=>{
  if(touches.has(e.pointerId)){
    touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&touches.size===2){
      const [a,b]=[...touches.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y);
      if(pinch.d>0) zoomAt(d/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2); pinch.d=d;
      if(VIEW==='hub'){  // moderne Welten: zwei Finger drehen = drehen, zwei Finger gemeinsam hoch/runter = neigen
        const ang=Math.atan2(b.y-a.y,b.x-a.x), my=(a.y+b.y)/2; let da=(ang-pinch.ang)*180/Math.PI; if(da>180) da-=360; if(da<-180) da+=360;
        hubTurn(da, -(my-pinch.my)*.3); pinch.ang=ang; pinch.my=my; }
      return;
    }
  }
  if(!drag) return;
  if(drag.type==='turn'){ hubTurn((e.clientX-drag.sx)*.4, -(e.clientY-drag.sy)*.25); drag.sx=e.clientX; drag.sy=e.clientY; return; }
  if(drag.type==='pan'){ V.x=drag.vx+e.clientX-drag.sx; V.y=drag.vy+e.clientY-drag.sy; applyView(); }
  else if(drag.type==='node'){
    const w=toWorld(e.clientX,e.clientY); const a=agentById(drag.id);
    a.x=Math.round(w.x-drag.dx); a.y=Math.round(w.y-drag.dy); drag.moved=true;
    drag.el.style.left=a.x+'px'; drag.el.style.top=a.y+'px'; drawEdges();
  } else if(drag.type==='org'){
    const dx=(e.clientX-drag.sx)/V.s, dy=(e.clientY-drag.sy)/V.s;
    if(!drag.moved && Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy)<5) return; drag.moved=true;
    const k=orgOffKey(); ORG.off[k]=ORG.off[k]||{}; ORG.off[k][drag.id]=[Math.round(drag.o0[0]+dx), Math.round(drag.o0[1]+dy)];
    drawOrg();
  } else if(drag.type==='link'){
    const w=toWorld(e.clientX,e.clientY); const my=(drag.y1+w.y)/2;
    $('#tmp').setAttribute('d',`M${drag.x1},${drag.y1} V${my} H${w.x} V${w.y}`);
  }
});
const endTouch=e=>{ touches.delete(e.pointerId); if(touches.size<2) pinch=null; };
window.addEventListener('pointercancel',e=>{ endTouch(e); if(drag&&drag.type==='link'){ const t=$('#tmp'); if(t) t.remove(); } drag=null; $('#vp').classList.remove('panning'); });
window.addEventListener('pointerup',async e=>{
  endTouch(e);
  if(!drag) return; const d=drag; drag=null; $('#vp').classList.remove('panning','turning');
  const dropOn=(sel,self)=>{ for(const el of document.elementsFromPoint(e.clientX,e.clientY)){ const c=el.closest(sel); if(c && +(c.dataset.id||c.dataset.agent)!==self) return +(c.dataset.id||c.dataset.agent); } return 0; };
  if(d.type==='org' && d.moved){
    const target=dropOn('#orgsvg .ocard', d.id);
    if(target){  // auf eine andere Karte gezogen: nachfragen und unterstellen, die Karte springt an ihren Platz zurueck
      const k=orgOffKey(); if(d.o0[0]||d.o0[1]) ORG.off[k][d.id]=d.o0; else delete ORG.off[k][d.id];
      orgSaveOff(); ORG.sig=''; drawOrg(); connectAsk(d.id, target);
    } else orgSaveOff();
  }
  if(d.type==='node' && d.moved){
    const a=agentById(d.id), target=dropOn('.node', d.id);
    if(target){ a.x=d.x0; a.y=d.y0; d.el.style.left=a.x+'px'; d.el.style.top=a.y+'px'; drawEdges(); connectAsk(d.id, target); }
    else api('/agents/'+d.id,'PUT',{x:a.x,y:a.y});
  }
  if(d.type==='link'){
    const t=$('#tmp'); if(t) t.remove();
    const el=document.elementFromPoint(e.clientX,e.clientY); const n=el&&el.closest('.node');
    if(n && +n.dataset.id!==d.from) connectAsk(+n.dataset.id, d.from);
  }
});

async function connectAsk(childId, bossId){  // Verbinden immer mit Rueckfrage, damit nichts aus Versehen umgehaengt wird
  const c=agentById(childId), b=agentById(bossId); if(!c || !b || c.id===b.id) return;
  if(c.parent_id===b.id) return toast(`“${c.name}” already belongs to the team of “${b.name}”.`);
  for(let x=b; x; x=x.parent_id && agentById(x.parent_id)) if(x.id===c.id) return toast(`Not possible: “${b.name}” itself belongs to the team of “${c.name}”.`);
  if(!confirm(`Put “${c.name}” under the team of “${b.name}”?`)) return;
  try{ await api('/agents/'+c.id,'PUT',{parent_id:b.id}); }catch(_){}
  refresh(true);
}

function drawSettings(a){

const miniMd = t => esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|\s)\*(\S[^*]*?)\*(?=\s|$|[.,;:!?])/g,'$1<i>$2</i>');
async function drawChat(a){
  $('#pbody').innerHTML=`
    <div style="color:var(--mute);font-size:12px;margin-bottom:8px">Free conversation with ${esc(a.name)} – for thinking, philosophizing, developing ideas. No tools; to get it done, hand the conversation to the team as a task. Attached files (📎, drag in, paste or 📂 from <code>input/</code>) go to ${esc(a.name)} directly with the message: texts, PDFs and Word as text, images as images.</div>
    <div id="chatlog"></div>
    <div id="chatbox">
      <div id="chatpick"></div>
      <div id="chatatt"></div>
      <textarea id="chatin" style="min-height:70px" placeholder="Write something … (Enter sends, Shift+Enter = new line)"></textarea>
    </div>
    <input type="file" id="chatfile" multiple style="display:none">
    <div class="row"><button class="btn pri" id="chatsend">Send</button><button class="btn" id="chatattach" title="Attach files (e.g. sample.png, PDFs, layouts). They are saved to input/.">📎 File</button><button class="btn" id="chatinput" title="Attach a file that is already in input/">📂 from input/</button><button class="btn" id="chatorder">📋 Give as task</button><button class="btn danger sm" id="chatclear">Clear history</button></div>`;
  const log=$('#chatlog'), att=[];  // att: {file, el, path, busy}
  const add=(role,text,cls='')=>{ const d=document.createElement('div'); d.className='bub '+role+' '+cls; d.innerHTML=role==='assistant'?miniMd(text):esc(text); log.appendChild(d); log.scrollTop=log.scrollHeight; return d; };
  (await api('/agents/'+a.id+'/chat')).forEach(m=>add(m.role,m.content));
  async function waitJob(jid, w, ub, msg){  // Antwort laeuft im Hintergrund; alle 2,5 s nachfragen, Netzaussetzer abwarten
    for(;;){
      await new Promise(r=>setTimeout(r,2500));
      if(!document.body.contains(w)) return null;  // Panel geschlossen: Antwort landet trotzdem im Verlauf
      let j=null;
      try{ const r=await fetch('/api/agents/'+a.id+'/chat/job?id='+encodeURIComponent(jid)); if(r.status===401){ location.href='/login'; return null; } if(!r.ok) continue; j=await r.json(); }
      catch(e){ continue; }
      if(!j){ w.remove(); return null; }
      if(j.done){
        if(j.error){ w.remove(); if(ub) ub.remove(); toast(j.error); if(!$('#chatin').value) $('#chatin').value=msg||''; return null; }
        w.className='bub assistant'; w.innerHTML=miniMd(j.reply); log.scrollTop=log.scrollHeight; return j;
      }
      w.textContent='writing … '+fmtDur(j.secs)+(j.chars?' · '+j.chars+' characters':' · reading your message')
        +(j.secs>60?' (slow model, the answer will still arrive)':'');
    }
  }
  try{ const j=await api('/agents/'+a.id+'/chat/job'); if(j && !j.done){ $('#chatsend').disabled=true;
    const ub=add('user',j.message), w=add('assistant','writing …','wait'); waitJob(j.job,w,ub,j.message).then(()=>{ $('#chatsend').disabled=false; }); } }catch(e){}
  function attach(files){
    if(!S.pid){ toast('Choose a project first.'); return; }
    for(const f of files){
      const it={file:f,path:null,busy:true}; att.push(it);
      it.el=document.createElement('span'); it.el.className='att up'; it.el.innerHTML='<span></span><button class="icon-btn" title="Remove">✕</button>';
      it.el.firstChild.textContent='⏳ '+(f.name||'Image');
      it.el.lastChild.onclick=()=>{ att.splice(att.indexOf(it),1); it.el.remove(); };
      $('#chatatt').appendChild(it.el);
      it.up=uploadFile(f).then(r=>{ it.path=r.path; it.el.className='att'; it.el.firstChild.textContent='📎 '+r.path; it.el.title=r.path; })
        .catch(e=>{ it.el.className='att err'; it.el.firstChild.textContent='⚠ '+(f.name||'File'); it.el.title=e.message; toast(e.message); })
        .finally(()=>{ it.busy=false; });
    }
  }
  function attachExisting(path){
    if(att.some(x=>x.path===path)) return;
    const it={path,busy:false,up:Promise.resolve()}; att.push(it);
    it.el=document.createElement('span'); it.el.className='att'; it.el.innerHTML='<span></span><button class="icon-btn" title="Remove">✕</button>';
    it.el.firstChild.textContent='📎 '+path; it.el.title=path;
    it.el.lastChild.onclick=()=>{ att.splice(att.indexOf(it),1); it.el.remove(); };
    $('#chatatt').appendChild(it.el);
  }
  $('#chatinput').onclick=async()=>{
    const pick=$('#chatpick'); if(pick.innerHTML){ pick.innerHTML=''; return; }
    if(!S.pid) return;
    const r=await api('/projects/'+S.pid+'/files'); const fs=r.files.filter(f=>f.path.startsWith('input/')).sort((x,y)=>y.mtime-x.mtime);
    if(!fs.length){ toast('Nothing in input/ yet. Upload with 📎.'); return; }
    fs.forEach(f=>{ const b=document.createElement('button'); b.innerHTML='<span></span><small></small>'; b.firstChild.textContent=f.path; b.lastChild.textContent=f.size<1048576?Math.max(1,Math.round(f.size/1024))+' KB':(f.size/1048576).toFixed(1)+' MB';
      b.onclick=()=>{ attachExisting(f.path); b.remove(); if(!pick.querySelector('button')) pick.innerHTML=''; }; pick.appendChild(b); });
  };
  async function send(){
    const inp=$('#chatin'); let msg=inp.value.trim();
    if(att.some(x=>x.busy)){ $('#chatsend').disabled=true; $('#chatsend').textContent='Uploading …'; await Promise.all(att.map(x=>x.up)); $('#chatsend').textContent='Send'; }
    const files=att.filter(x=>x.path).map(x=>x.path);
    if(!msg && !files.length){ $('#chatsend').disabled=false; return; }
    const shown=(files.length?'📎 '+files.join(', ')+(msg?'\n\n':''):'')+msg;
    inp.value=''; const ub=add('user',shown); const w=add('assistant','thinking …','wait'); $('#chatsend').disabled=true;
    try{
      const r=await api('/agents/'+a.id+'/chat','POST',{message:msg,files});
      if(r.job){ att.splice(0).forEach(x=>x.el.remove()); $('#chatpick').innerHTML='';
        if((r.files||[]).length>files.length) ub.textContent='📎 '+r.files.join(', ')+(msg?'\n\n':'')+msg;
        w.textContent='writing …'; await waitJob(r.job,w,ub,msg); $('#chatsend').disabled=false; inp.focus(); return; }
      w.className='bub assistant'; w.innerHTML=miniMd(r.reply);
      if((r.files||[]).length>files.length) ub.textContent='📎 '+r.files.join(', ')+(msg?'\n\n':'')+msg;
      att.splice(0).forEach(x=>x.el.remove()); $('#chatpick').innerHTML='';
    }
    catch(e){ w.remove(); ub.remove(); inp.value=msg; }
    $('#chatsend').disabled=false; log.scrollTop=log.scrollHeight; inp.focus();
  }
  $('#chatsend').onclick=send;
  $('#chatin').onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } };
  $('#chatattach').onclick=()=>$('#chatfile').click();
  $('#chatfile').onchange=e=>{ attach([...e.target.files]); e.target.value=''; };
  const box=$('#pbody'), zone=$('#chatbox'); let dz=0;
  box.ondragenter=e=>{ if([...e.dataTransfer.types].includes('Files')){ e.preventDefault(); dz++; zone.classList.add('drop'); } };
  box.ondragover=e=>{ if([...e.dataTransfer.types].includes('Files')) e.preventDefault(); };
  box.ondragleave=()=>{ if(--dz<=0){ dz=0; zone.classList.remove('drop'); } };
  box.ondrop=e=>{ if(!e.dataTransfer.files.length) return; e.preventDefault(); dz=0; zone.classList.remove('drop'); attach([...e.dataTransfer.files]); };
  $('#chatin').onpaste=e=>{ const fs=[...(e.clipboardData&&e.clipboardData.files||[])]; if(fs.length){ e.preventDefault(); attach(fs); } };
  $('#chatorder').onclick=async()=>{
    const t=prompt('Title of the task (empty = from your last message):',''); if(t===null) return;
    const r=await api('/agents/'+a.id+'/chat/order','POST',{title:t}); toast('Task #'+r.id+' given, the result arrives as mail.'); refresh(true);
  };
  $('#chatclear').onclick=async()=>{ if(confirm('Delete the conversation history?')){ await api('/agents/'+a.id+'/chat','DELETE'); drawChat(a); } };
}
/* ---------- Ergebnisse kopieren (geht auch ohne HTTPS, dort fehlt navigator.clipboard) ---------- */
const resHtml = t => `<div class="res"><button class="cpy" title="Copy the whole text">📋 Copy</button><pre>${esc(t)}</pre></div>`;
async function copyText(t){
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(t); return true; } }catch(_){}
  const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,t.length);
  let ok=false; try{ ok=document.execCommand('copy'); }catch(_){} ta.remove(); return ok;
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('.res .cpy'); if(!b) return; e.preventDefault(); e.stopPropagation();
  const ok=await copyText(b.nextElementSibling.textContent);
  b.textContent=ok?'✓ Copied':'Select and copy'; setTimeout(()=>b.textContent='📋 Copy',1800);
  if(!ok){ const r=document.createRange(); r.selectNodeContents(b.nextElementSibling); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); }
});

function selectingIn(el){ const sel=getSelection(); return sel && !sel.isCollapsed && sel.rangeCount && el.contains(sel.getRangeAt(0).commonAncestorContainer); }

function treeHtml(list){

    <summary><span class="chip ${c.status}">${STATUS[c.status]||c.status}</span><span class="t">${esc(c.title)}</span><span class="who">${esc(c.agent_name||'?')}${c.rounds?` · revised ${c.rounds}×`:''}</span></summary>
    ${c.result?resHtml(c.result):''}
    ${(c.children&&c.children.length)?`<div class="tree">${treeHtml(c.children)}</div>`:''}
  </details>`).join('');
}

    </details>`).join(''):'<div style="color:var(--mute)">No tasks yet.</div>';

        <div>${r.inbox==='closed'?'☑ done':(KIND[r.status]||r.status)} – ${esc(r.title)}${r.team?` <span style="color:var(--mute);font-size:12px">· Team: ${r.team} tasks, ${r.revisions} send-backs</span>`:''}</div>
        <details><summary style="cursor:pointer;color:var(--mute);font-size:12px">Show result</summary>${resHtml(r.result||'(empty)')}</details>
        <div class="row">
          ${r.inbox==='new'?`<button class="btn pri sm" data-ok="${r.id}">✅ Done</button>`:''}
          ${['done','failed','blocked'].includes(r.status)?`<button class="btn sm" data-rw="${r.id}">🔁 Revise…</button>`:''}
          ${r.report&&r.result?`<button class="btn sm" data-prn="${r.id}" title="Print this evening report on the selected printer (asks first)">🖨 Print</button>`:''}

    if(del) del.onclick=async()=>{ const ids=picked(); if(!ids.length) return;

    body.querySelectorAll('[data-rw]').forEach(b=>b.onclick=async()=>{ const fb=prompt('What should be changed?'); if(!fb||!fb.trim()) return; await api('/inbox/'+b.dataset.rw+'/rework','POST',{feedback:fb}); await load(); refresh(true); });
    const go=$('#no_go'); if(go) go.onclick=async()=>{ const t=$('#no_t').value.trim(); if(!t){ toast('Title missing'); return; }

  }
  load();
};
async function showFiles(){
  if(!S.pid){ toast('Choose a project first.'); return; }
  openOv('Files of this project'); const body=$('#ovbody');
  const r=await api('/projects/'+S.pid+'/files');
  const isImg=p=>/\.(png|jpe?g|gif|webp|svg)$/i.test(p), isVid=p=>/\.(mp4|webm|mov)$/i.test(p), isAud=p=>/\.(mp3|wav|ogg|m4a)$/i.test(p);
  const kb=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB';
  const icon=p=>isVid(p)?'🎬':isAud(p)?'🎵':/\.pdf$/i.test(p)?'📕':/\.(epub|docx)$/i.test(p)?'📘':'📄';
  const idx=r.files.find(f=>f.path==='www/index.html')||r.files.find(f=>f.path==='index.html');
  const top=p=>p.includes('/')?p.split('/')[0]:'';
  const gm=new Map(); r.files.forEach(f=>{ const g=top(f.path); if(!gm.has(g)) gm.set(g,[]); gm.get(g).push(f); });
  const ORD=['input','output','www','wissen'], groups=[...gm.entries()].sort((x,y)=>{ const i=ORD.indexOf(x[0]), j=ORD.indexOf(y[0]);
    return (x[0]===''?99:i<0?50:i)-(y[0]===''?99:j<0?50:j) || x[0].localeCompare(y[0]); });
  const st=await api('/projects/'+S.pid+'/site');
  body.innerHTML = `
    <div class="task" style="padding:10px;margin-bottom:12px">
      <b>🚀 Publish website</b>
      <div style="color:var(--mute);font-size:12px;margin:3px 0 6px">${st.running?'🟢 Online: '+st.urls.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener" style="color:var(--accent)">${esc(u)}</a>`).join(' · ')+(st.host==='127.0.0.1'?' <br>(only reachable on the server itself; for the network set <code>PCL_SITE_HOST=0.0.0.0</code> in .env)':''):(st.has_index?(st.legacy?'There is no <code>www/</code> folder: the whole project folder is served (without <code>input/</code>). Safer: put the site into <code>www/</code>, then only that is published.':'The <code>www/</code> folder is served permanently, nothing else. Changes by the agents are visible immediately.'):'No <code>www/index.html</code> yet (or <code>index.html</code> in the project folder).')}</div>
      <button class="btn ${st.running?'danger':'pri'} sm" id="sitebtn" ${(!st.running&&!st.has_index)?'disabled':''}>${st.running?'Take offline':'Publish'}</button>
    </div>
    <div class="task" style="padding:10px;margin-bottom:12px">
      <b>Upload your own files for the team</b>
      <div style="color:var(--mute);font-size:12px;margin:3px 0 6px">Videos to edit, PDFs to read, images, texts. They land in <code>input/</code>, where the team finds them.</div>
      <input type="file" id="upf" multiple style="width:auto"><div id="upst" style="font-size:12px;color:var(--mute);margin-top:4px"></div>
    </div>`
    + (r.files.length ? `<div class="row" style="margin:0 0 10px"><a class="btn pri sm" href="${r.zip}">⬇ Everything as ZIP</a>
      ${idx?`<a class="btn sm" target="_blank" rel="noopener" href="${idx.url}">🌐 Open website (index.html)</a>`:''}</div>
      <div style="color:var(--mute);font-size:12px;margin-bottom:8px">The preview runs isolated (sandbox). The link contains a secret key, do not share it.</div>`
      + `<div class="inbar">
        <label title="Select all files or clear the selection"><input type="checkbox" id="f_all"> Select all</label>
        <button class="btn sm" id="f_del" disabled title="Delete all ticked files (asks first)">🗑 Delete selected</button>
      </div>`
      + groups.map(([g,fs])=>`<div class="fgrp">
        <div class="fgrp-head">
          <label class="insel" title="Select every file in this folder"><input type="checkbox" data-fgrp="${esc(g)}" aria-label="Select folder ${esc(g)}"></label>
          <b style="flex:1">${g?'📁 '+esc(g)+'/':'📄 Project folder'}</b>
          <span style="color:var(--mute);font-size:12px;white-space:nowrap">${fs.length} file${fs.length===1?'':'s'} · ${kb(fs.reduce((a,f)=>a+f.size,0))}</span>
          ${g?`<button class="btn danger sm" data-fclr="${esc(g)}" title="Delete everything in ${esc(g)}/ (asks first)">🧹 Empty folder</button>`:''}
        </div>`
      + fs.map(f=>`<div class="task" style="padding:8px;display:flex;gap:10px;align-items:center">
        <label class="insel" title="Select this file (to delete it)"><input type="checkbox" data-fsel="${esc(f.path)}" data-fg="${esc(g)}" aria-label="Select ${esc(f.path)}"></label>
        ${isImg(f.path)?`<img src="${f.url}" style="width:44px;height:44px;object-fit:cover;border-radius:6px">`:`<span style="width:44px;text-align:center;font-size:22px">${icon(f.path)}</span>`}
        <a href="${f.url}" target="_blank" rel="noopener" style="flex:1;color:var(--text);word-break:break-all">${esc(f.path)}</a>
        <span style="color:var(--mute);font-size:12px;white-space:nowrap">${kb(f.size)}</span>
        <button class="icon-btn" title="Upload (GitHub, Google Drive, OneDrive) or send to Telegram" data-cup="${esc(f.path)}">☁️</button>
        <button class="icon-btn" title="Delete file" data-delf="${esc(f.path)}">🗑</button></div>`).join('')+'</div>').join('')
      : '<div style="color:var(--mute)">No files yet. What the team creates (websites, images, videos, documents) appears here.</div>');
  $('#sitebtn').onclick=async()=>{ try{ await api('/projects/'+S.pid+'/site','POST',{enabled:!st.running}); }catch(_){} showFiles(); };
  $('#upf').onchange=async e=>{
    const st=$('#upst');
    for(const f of e.target.files){
      st.textContent='Uploading: '+f.name+' …';
      try{ await uploadFile(f); }catch(err){ toast(err.message); break; }
    }
    showFiles();
  };
  body.querySelectorAll('[data-delf]').forEach(b=>b.onclick=async()=>{ if(confirm('Delete “'+b.dataset.delf+'”?')){ await fetch('/api/projects/'+S.pid+'/files?path='+encodeURIComponent(b.dataset.delf),{method:'DELETE',headers:{'X-PCL':'1'}}); showFiles(); } });
  body.querySelectorAll('[data-cup]').forEach(b=>b.onclick=()=>cloudUpload(b.dataset.cup));
  const sels=[...body.querySelectorAll('[data-fsel]')], all=$('#f_all'), del=$('#f_del');
  const grps=[...body.querySelectorAll('[data-fgrp]')];
  const picked=()=>sels.filter(c=>c.checked).map(c=>c.dataset.fsel);
  const tri=(box,list)=>{ const n=list.filter(c=>c.checked).length; box.checked=n>0&&n===list.length; box.indeterminate=n>0&&n<list.length; };
  const upd=()=>{ if(!del) return; const n=picked().length; del.disabled=!n; del.textContent='🗑 Delete selected'+(n?` (${n})`:'');
    tri(all,sels); grps.forEach(gb=>tri(gb,sels.filter(c=>c.dataset.fg===gb.dataset.fgrp))); };
  sels.forEach(c=>c.onchange=upd);
  grps.forEach(gb=>gb.onchange=()=>{ sels.filter(c=>c.dataset.fg===gb.dataset.fgrp).forEach(c=>c.checked=gb.checked); upd(); });
  if(all) all.onchange=()=>{ sels.forEach(c=>c.checked=all.checked); upd(); };
  if(del) del.onclick=async()=>{ const paths=picked(); if(!paths.length) return;
    if(!confirm(`Delete ${paths.length} file${paths.length===1?'':'s'}?\n\n`+paths.slice(0,8).join('\n')+(paths.length>8?`\n… and ${paths.length-8} more`:''))) return;
    try{ const x=await api('/projects/'+S.pid+'/files/delete','POST',{paths}); toast(`${x.deleted} file${x.deleted===1?'':'s'} deleted`); }catch(_){}
    showFiles(); };
  body.querySelectorAll('[data-fclr]').forEach(b=>b.onclick=async()=>{ const g=b.dataset.fclr, n=(gm.get(g)||[]).length;
    if(!confirm(`Really empty the folder “${g}/”?\n\nAll ${n} file${n===1?'':'s'} in it (including subfolders) are deleted for good. The folder itself stays.`)) return;
    try{ const x=await api('/projects/'+S.pid+'/files/clear','POST',{folder:g,confirm:true}); toast(`Folder ${g}/ emptied (${x.deleted})`); }catch(_){}
    showFiles(); });
}
$('#btnFiles').onclick=showFiles;

      <pre style="white-space:pre-wrap;font-size:11px">curl -X POST -H 'Content-Type: application/json' -d '{"text":"Please write the weekly report"}' ${esc(hookUrl)}</pre>`:''}
    </div>
    <div class="task" style="padding:10px;margin-bottom:12px"><b>📤 New connection</b>${form()}<div class="row" style="margin-top:8px"><button class="btn pri sm" id="cn_add">Create</button></div></div>
    ${r.connections.map(c=>`<div class="task" style="padding:10px;${c.enabled?'':'opacity:.55'}">
      <div style="display:flex;gap:8px;align-items:center"><b style="flex:1;word-break:break-all">${esc(c.name)}</b><span style="color:var(--mute);font-size:12px">${esc(c.method)}${c.confirm?' · approval':''}${c.on_post?' · mail':''}</span></div>
      <div style="color:var(--mute);font-size:12px;word-break:break-all">${esc(c.url)}</div><div style="font-size:13px;margin-top:4px">${esc(c.description||'')}</div>

/* ---------- Cloud (GitHub, Google Drive, OneDrive, Telegram) ---------- */
async function showCloud(){
  if(!S.pid){ toast('Choose a project first.'); return; }
  openOv('☁️ Cloud'); const body=$('#ovbody');
  const r=await api('/projects/'+S.pid+'/cloud');
  const help={github:'Token and repo in .env (GITHUB_UPLOAD_TOKEN, GITHUB_UPLOAD_REPO). Files over 50 MB go as a release attachment.',
    gdrive:'Hyperstead only sees files and folders it created itself. Missing folders are created.',
    onedrive:'Folders anywhere in OneDrive are possible, OneDrive creates missing folders.',
    telegram:'Sends files up to 50 MB to your chat. On the phone: /datei'};
  body.innerHTML=`<div style="color:var(--mute);font-size:12px;margin-bottom:10px">Here you set up where files are uploaded. You can upload any file under 📁 Files (button ☁️). Agents with the permission “May upload to the cloud” always ask you first under ✋ Approvals. Guide: <code>docs/cloud.md</code></div>`
    + Object.entries(r.services).map(([k,s])=>`<div class="task" style="padding:10px;margin-bottom:10px">
      <div style="display:flex;gap:8px;align-items:center"><b style="flex:1">${esc(s.label)}</b><span style="font-size:12px">${!s.configured?'⚪ not set up':s.logged_in?'🟢 ready':'🟡 not signed in'}</span></div>
      <div style="color:var(--mute);font-size:12px;margin:3px 0 6px">${esc(s.configured?help[k]:s.hint)}</div>
      ${k in r.folders?`<label>Target folder for this project (empty = top level)</label><div class="row"><input type="text" data-cf="${k}" value="${esc(r.folders[k])}" style="flex:1"><button class="btn sm" data-cfsave="${k}">Save</button></div>`:''}
      ${s.login&&s.configured?`<div class="row" style="margin-top:6px">${s.logged_in?`<button class="btn sm" data-clogout="${k}">Sign out</button>`:''}<button class="btn ${s.logged_in?'':'pri'} sm" data-clogin="${k}">${s.logged_in?'Sign in again':'Sign in'}</button></div>
        <div id="cl_${k}" style="font-size:13px;margin-top:6px">${s.pending&&s.pending.state==='pending'?loginHtml(s.pending):''}</div>`:''}
    </div>`).join('');
  function loginHtml(p){ return `Open <a href="${esc(p.url)}" target="_blank" rel="noopener" style="color:var(--accent)">${esc(p.url)}</a> (on your phone or PC) and enter this code:<div style="font-size:24px;font-weight:700;letter-spacing:2px;margin:6px 0">${esc(p.user_code)}</div><button class="btn sm" onclick="copyText('${esc(p.user_code)}')">📋 Copy code</button> <span style="color:var(--mute)">Waiting for confirmation …</span>`; }
  async function watch(k){
    for(let i=0;i<200;i++){
      await new Promise(res=>setTimeout(res,3000));
      if(!$('#cl_'+k)) return;
      const x=(await api('/projects/'+S.pid+'/cloud')).services[k];
      const p=x.pending||{};
      if(p.state==='ok'){ toast(x.label+': angemeldet'); showCloud(); return; }
      if(p.state==='error'){ $('#cl_'+k).textContent='❌ '+p.message; return; }
    }
  }
  body.querySelectorAll('[data-cfsave]').forEach(b=>b.onclick=async()=>{ const k=b.dataset.cfsave;
    const x=await api('/projects/'+S.pid+'/cloud','PUT',{folders:{[k]:body.querySelector(`[data-cf="${k}"]`).value}});
    body.querySelector(`[data-cf="${k}"]`).value=x.folders[k]; toast('Saved'); });
  body.querySelectorAll('[data-clogin]').forEach(b=>b.onclick=async()=>{ const k=b.dataset.clogin;
    try{ const p=await api('/cloud/'+k+'/login','POST',{}); $('#cl_'+k).innerHTML=loginHtml(p); watch(k); }catch(_){} });
  body.querySelectorAll('[data-clogout]').forEach(b=>b.onclick=async()=>{ if(confirm('Sign out? After that Hyperstead can no longer upload there.')){ await api('/cloud/'+b.dataset.clogout+'/logout','POST',{}); showCloud(); } });
  Object.entries(r.services).forEach(([k,s])=>{ if(s.pending&&s.pending.state==='pending') watch(k); });
}
$('#btnCloud').onclick=showCloud;

async function showPrinters(){

  openOv('🖨 Printer'); const body=$('#ovbody'); body.innerHTML='<div style="color:var(--mute)">Looking for printers …</div>';

async function prSetup(n){
  if(!n||!confirm('Set up “'+n+'” as a printer in CUPS on this Pi (driverless, shared so the laptop can use it)?')) return;
  const out=$('#pr_out'); out.innerHTML='<div style="color:var(--mute);margin-top:8px">Setting up the printer …</div>';
  try{ const x=await api('/printers/setup','POST',{printer:n}); toast('✅ '+x.message); await showPrinters(); }
  catch(e){ out.innerHTML=`<div class="task" style="padding:8px;margin-top:8px;border-color:var(--warn,#c90)">⚠ ${esc(String(e.message||e))}</div>`; }
}
async function prDiag(n,append){
  const out=$('#pr_out'); if(!out) return;
  let r; try{ r=await api('/printers/status?printer='+encodeURIComponent(n)); }catch(_){ return; }
  const html=`<div class="task" style="padding:8px;margin-top:8px"><b>🩺 ${esc(n)}</b>
    ${r.setup?`<div style="margin:6px 0"><button class="btn sm pri" data-prsetup="1" title="Set up this network printer once in CUPS (driverless, shared for the laptop)">🔧 Set up printer</button></div>`:''}
    ${r.problems.length?`<ul style="margin:6px 0 4px 18px">${r.problems.map(p=>`<li>⚠ ${esc(p)}</li>`).join('')}</ul>`:'<div style="margin:6px 0">No problem found by the system. If nothing comes out: is the printer on, has paper, and is it reachable from this computer?</div>'}
    <div style="font-size:12px;color:var(--mute)">Waiting jobs: ${r.jobs.length?r.jobs.map(esc).join('<br>'):'none'}</div>
    ${r.lines.length?`<details style="margin-top:4px"><summary style="cursor:pointer;font-size:12px;color:var(--mute)">Details</summary><pre style="white-space:pre-wrap;font-size:11px">${esc(r.lines.join('\n'))}</pre></details>`:''}</div>`;
  if(append) out.insertAdjacentHTML('beforeend',html); else out.innerHTML=html;
  out.querySelectorAll('[data-prsetup]').forEach(b=>b.onclick=()=>prSetup(n));
}

async function cloudUpload(path){
  const r=await api('/projects/'+S.pid+'/cloud');
  const ready=Object.entries(r.services).filter(([k,s])=>s.configured&&s.logged_in);
  openOv('☁️ Upload'); const body=$('#ovbody');
  if(!ready.length){ body.innerHTML='<div style="color:var(--mute)">No service set up yet. See ☁️ Cloud in the sidebar.</div><div class="row" style="margin-top:8px"><button class="btn sm" id="cu_back">Back</button></div>'; $('#cu_back').onclick=showFiles; return; }
  body.innerHTML=`<div style="word-break:break-all;margin-bottom:8px"><b>${esc(path)}</b></div>
    <label>Where to?</label><select id="cu_to">${ready.map(([k,s])=>`<option value="${k}">${esc(s.label)}</option>`).join('')}</select>
    <div id="cu_fwrap"><label>Folder (empty = top level)</label><input type="text" id="cu_folder"></div>
