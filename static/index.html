    <div id="cu_st" style="margin-top:10px;font-size:13px;word-break:break-all"></div>`;
  const setF=()=>{ const k=$('#cu_to').value; $('#cu_fwrap').style.display=k in r.folders?'':'none'; $('#cu_folder').value=r.folders[k]||''; };
  $('#cu_to').onchange=setF; setF(); $('#cu_back').onclick=showFiles;
  $('#cu_go').onclick=async()=>{ const k=$('#cu_to').value; $('#cu_go').disabled=true; $('#cu_st').textContent='Uploading … (large files take a while)';
    try{
      const j=await api('/projects/'+S.pid+'/cloud/upload','POST',k in r.folders?{to:k,path,folder:$('#cu_folder').value}:{to:k,path});
      for(;;){ await new Promise(res=>setTimeout(res,2000)); const x=await api('/cloud/jobs/'+j.job);
        if(x.state==='running') continue;
        const link=(x.message.match(/https:\/\/\S+/)||[])[0];
        $('#cu_st').innerHTML=(x.state==='done'?'✅ ':'❌ ')+esc(x.message)+(link?`<div class="row" style="margin-top:6px"><a class="btn sm" href="${esc(link)}" target="_blank" rel="noopener">Open</a><button class="btn sm" onclick="copyText('${esc(link)}')">📋 Copy link</button></div>`:'');
        break; }

    $('#cu_go').disabled=false; };
}

      <div style="color:var(--mute);font-size:12px;margin-top:4px">No limit, overview only. Subscription (Claude/Codex CLI) and Ollama cost $0 here, but count against your subscription or the server.</div>
      ${abo.length?`<div style="margin-top:6px">${abo.map(([k,v])=>`${esc(r.labels[k]||k)}: <b>${v}</b> calls in the last 5 h${r.abo_warn?` (Telegram warning from ${r.abo_warn})`:''}`).join('<br>')}</div>`:''}</div>
    <b>By project</b>${tbl(r.by_project,'<th>Project</th>',x=>`<td>${esc(x.name)}</td>`)}
    <br><b>By agent</b>${tbl(r.by_agent,'<th>Agent</th>',x=>`<td>${esc(x.name)} <span style="color:var(--mute);font-size:11px">${esc(x.project)}</span></td>`)}
    <br><b>By AI model</b>${tbl(r.by_model,'<th>Model</th>',x=>`<td>${esc(r.labels[x.name]||x.name)}<br><span style="color:var(--mute);font-size:11px">${esc(x.model||'')}</span></td>`)}

  body.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>showUsage(+b.dataset.days));
}

      $('#tp_loc_hint').textContent = ol&&ol.configured ? 'Ollama selected – choose a model in the list. Small local models are slow on the Pi; for bosses a strong model is better.'
        : 'Ollama is not reachable right now (is “ollama serve” running? Address OLLAMA_URL in .env). You can still assign it already.';
      ids.forEach(id=>{ const e=$('#'+id+'_p'); e.value='ollama'; e.dispatchEvent(new Event('change')); });
    };
    $('#tp_loc_all').onclick=()=>setLocal(['tp_lead','tp_team']);
    $('#tp_loc_team').onclick=()=>setLocal(['tp_team']);
    $('#tp_back').onclick=()=>newProjectDialog();
    $('#tp_go').onclick=async()=>{
      $('#tp_go').disabled=true;
      const r=await api('/projects/from_template','POST',{template:t.key,name:$('#tp_name').value.trim()||t.label,goal:$('#tp_goal').value.trim()||undefined,
        models:{lead:{provider:$('#tp_lead_p').value,model:$('#tp_lead_m').value},team:{provider:$('#tp_team_p').value,model:$('#tp_team_m').value}}});
      $('#ov').classList.remove('on'); await loadProjects(); await openProject(r.id); toast('Company founded.');
    };
  });
};
$('#btnAudit').onclick=async()=>{
  openOv('History (audit log)');
  const rows=await api('/audit?limit=200'+(S.pid?'&project_id='+S.pid:''));
  $('#ovbody').innerHTML=rows.length?rows.map(r=>`<div class="logrow"><span class="ts">${fmt(r.ts)}</span> <b>${esc(r.event)}</b> ${r.agent_name?'· '+esc(r.agent_name):''}<br>${esc(r.detail)}</div>`).join(''):'<div style="color:var(--mute)">Empty.</div>';
};


/* ---------- Betriebszentrale (nur vorhandene Daten) ---------- */
async function showOps(){
  if(!S.pid){ toast('Choose a project first.'); return; }
  openOv('🛰 Operations center'); const body=$('#ovbody');
  let r; try{ r=await api('/projects/'+S.pid+'/ops'); }catch(e){ return; }
  if(!$('#ov').classList.contains('on')) return;
  const c=r.counts||{}, task=wword('tasks','tasks');
  const tile=(ico,n,lbl,go)=>`<button class="ops-tile" ${go?`data-go="${go}"`:'disabled'}><span>${ico}</span><b>${n}</b><small>${lbl}</small></button>`;
  const cost=x=>x&&x.calls?`${usdShort(x.cost)} · ${(x.calls||0).toLocaleString('en-US')} ${x.calls===1?'call':'calls'}`:'0 $ · no calls';
  const ago=ts=>{ const m=Math.round((Date.now()/1000-ts)/60); return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':fmt(ts); };
  const agentLink=x=>x.agent_id?`<a href="#" data-agent="${x.agent_id}">${esc(x.agent_name||'?')}</a>`:esc(x.agent_name||'?');
  const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const when=s=>s.at==='open'?'at opening':s.at==='close'?'at closing':esc(s.at);
  const days=d=>{ const l=String(d||'').split(',').filter(x=>x!=='').map(Number); return l.length===7?'daily':l.map(i=>DAYS[i]).join(' '); };
  const sec=(id,title,n,html)=>`<section class="ops-sec" id="ops_${id}"><h4>${title} <span class="ops-n">${n}</span></h4>${html}</section>`;
  const empty=t=>`<div class="ops-empty">${t}</div>`;
  body.innerHTML=`
    ${r.open?'':'<div class="task" style="padding:8px;margin-bottom:10px">🌙 Outside business hours: new tasks wait until work starts.</div>'}
    <div class="ops-tiles">
      ${tile('▶',(c.running||0),'running','active')}
      ${tile('⏳',(c.queued||0)+(c.waiting_subtasks||0),'waiting','active')}
      ${tile('✋',r.approvals.length,'Approvals','appr')}
      ${tile('🔧',r.failed.length,'Errors (7 days)','failed')}
      ${tile('✓',(c.done||0),wword('done','done'),'')}
    </div>
    <div class="task ops-cost"><div>💶 <b>Today:</b> ${cost(r.cost_today)}</div><div>📅 <b>7 days:</b> ${cost(r.cost_week)}</div>
      <button class="btn sm" id="ops_usage">📊 All costs</button></div>
    ${sec('active','▶ Running and waiting',r.active.length,r.active.length?r.active.map(t=>`<div class="ops-row"><span class="chip ${t.status}">${STATUS[t.status]||esc(t.status)}</span><div class="ops-main"><b>${esc(t.title)}</b><small>${agentLink(t)} · ${ago(t.updated)}</small></div></div>`).join(''):empty('Nothing going on right now.'))}
    ${sec('appr','✋ Open approvals',r.approvals.length,r.approvals.length?r.approvals.map(a=>`<div class="ops-row"><span class="chip waiting_approval">${esc(a.kind)}</span><div class="ops-main"><b>${esc(a.task_title||'—')}</b><small>${esc(a.agent_name||'?')} · ${ago(a.created)}</small></div></div>`).join('')+'<div class="row" style="margin-top:6px"><button class="btn pri sm" id="ops_appr">Decide approvals</button></div>':empty('Nothing is waiting for you.'))}
    ${sec('failed','🔧 Failed (7 days)',r.failed.length,r.failed.length?r.failed.map(t=>`<div class="ops-row"><span class="chip failed">Error</span><div class="ops-main"><b>${esc(t.title)}</b><small>${agentLink(t)} · ${ago(t.updated)}</small>${t.error?`<div class="ops-err">${esc(t.error)}</div>`:''}</div>${t.parent_task_id?'':`<button class="btn sm" data-rerun="${t.id}">↻ Retry</button>`}</div>`).join(''):empty('No errors in the last 7 days.'))}
    ${sec('sched','🕘 Schedules',r.schedules.length,r.schedules.length?r.schedules.map(s=>`<div class="ops-row"><span class="chip ${s.enabled?'done':'todo'}">${s.enabled?'active':'off'}</span><div class="ops-main"><b>${s.kind==='inspect'?'🔎 ':''}${esc(s.title)}</b><small>${esc(s.agent_name||'?')} · ${when(s)} · ${days(s.days)}${s.last_run?' · last '+esc(s.last_run):''}</small></div><button class="btn sm" data-srun="${s.id}">▶ Now</button></div>`).join(''):empty('No schedules. Create them under 🕘 Schedule.'))}
    ${sec('err','⚠ Error messages in the history',r.errors.length,r.errors.length?r.errors.map(e=>`<div class="logrow"><span class="ts">${fmt(e.ts)}</span> <b>${esc(e.event)}</b> ${e.agent_name?'· '+esc(e.agent_name):''}<br>${esc(e.detail)}</div>`).join(''):empty('None.'))}
    ${sec('log','📜 Latest events',r.audit.length,r.audit.map(e=>`<div class="logrow"><span class="ts">${fmt(e.ts)}</span> <b>${esc(e.event)}</b> ${e.agent_name?'· '+esc(e.agent_name):''}<br>${esc(e.detail)}</div>`).join('')+'<div class="row" style="margin-top:6px"><button class="btn sm" id="ops_audit">Full history</button></div>')}
    <div class="ops-empty" style="margin-top:8px">All numbers come from the ${esc(task)}, approvals, schedules and the history of this project. Costs are estimates.</div>`;
  body.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ const el=$('#ops_'+b.dataset.go); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); });
  body.querySelectorAll('[data-agent]').forEach(a=>a.onclick=e=>{ e.preventDefault(); $('#ov').classList.remove('on'); selectAgent(+a.dataset.agent); });
  body.querySelectorAll('[data-rerun]').forEach(b=>b.onclick=async()=>{ b.disabled=true; try{ await api('/tasks/'+b.dataset.rerun+'/run','POST',{}); toast('Restarted'); }catch(e){} showOps(); refresh(true); });
  body.querySelectorAll('[data-srun]').forEach(b=>b.onclick=async()=>{ b.disabled=true; try{ await api('/schedules/'+b.dataset.srun+'/run','POST',{}); toast('Started'); }catch(e){} showOps(); refresh(true); });
  const on=(id,f)=>{ const el=$('#'+id); if(el) el.onclick=f; };
  on('ops_usage',()=>showUsage(1)); on('ops_appr',()=>$('#btnApprovals').click()); on('ops_audit',()=>$('#btnAudit').click());
}
$('#btnOps').onclick=showOps;

/* ---------- Anleitung (im Dashboard, offline) ---------- */
const HELP=[
 {id:'start',t:'🚀 Getting started',h:`<p>Hyperstead is your own AI company. You create a <b>project</b>; in it, <b>agents</b> (AI employees) work as a team: a boss at the top, below them leads and employees.</p>
<ul><li><b>Create a project:</b> In the sidebar tap “＋ New project”. In the window you choose an empty project or a ready-made company template (e.g. web agency).</li>
<li><b>Create an agent:</b> In the blueprint view tap a building block such as “👑 CEO” or “</> Developer” at the top, or drag it onto the canvas. Every agent needs an AI (provider + model) in its settings.</li>
<li><b>Give a task:</b> Tap an agent → “Tasks” tab → describe the task → “Assign task”. The boss distributes the work to their team, reviews the reports and delivers the result to the 📬 mail.</li>
<li><b>Collect the result:</b> Open 📬 Mail. “✅ Done” closes the task, “🔁 Revise…” sends it back with your note.</li></ul>
<p>On a phone, ☰ at the top left opens the sidebar. The sidebar is sorted into categories (📬 Daily business, 🤖 Team &amp; AI, 📁 Files &amp; connections, 📊 Reports): tapping expands or collapses a category, the device remembers it. A colored dot on a collapsed category means something is waiting in it (e.g. new mail).</p>`},
 {id:'welt',t:'🌱 Growth and graphics',h:`<p>Every project grows from stage to stage with its successes. In the bar at the top you see the stage, points and the progress to the next stage. This only changes the look, never the agents' work.</p>
<ul><li><b>Points:</b> delivery accepted the first time +10, after revision +5, task done in the mail +20, failed −3, rework requested −5.</li>
<li><b>Stages:</b> from 0, 100, 300, 700 and 1500 points. The stage only limits how many agents the management recruits <i>by itself</i>. You can always create everything by hand. Turn it off under ⓘ in the bar.</li>
<li><b>Ranks:</b> agents rise with their own accepted deliveries (from 5, 20, 60).</li>
<li><b>Choosing a graphic:</b> The drop-down button at the top right of the bar (e.g. “Org chart: Tree ▾”) has two groups: <b>Classic</b> with three org charts (tree, outline, circle) and Blueprint for precise editing, <b>Modern</b> with all companies as 🏙 City, 🌌 Cosmos or 🧬 Molecule. The device remembers the choice. The <b>←</b> button next to it takes you back to the graphic you saw before (same view, same company, inside or outside), without switching to another design.</li>
<li><b>Org chart:</b> shows the same team as a classic org chart in three styles, selectable in the graphic button: <b>Tree</b> (top to bottom, employees without their own team are stacked), <b>Outline</b> (one line per agent, indented by level, best on phones) and <b>Circle</b> (management in the middle, each level a ring). The colored stripe or ring shows the state: green ready, blue working, yellow waiting for your approval, red error, purple waiting for the team, gray paused. Tapping opens the agent. The device remembers the chosen style. Cards can be moved with the mouse or a finger, the lines follow. The device remembers this per project and style; “↺ Reset layout” at the top center restores the order.</li>
<li><b>🌓</b> switches light/dark. Under ⓘ you can turn off motion and celebration effects.</li></ul>`},
 {id:'agenten',t:'🤖 Agents, AI and permissions',h:`<p>Tapping an agent opens the side panel with the tabs Settings, 💬 Chat, Tasks and History.</p>
<ul><li><b>Choose an AI:</b> provider and model. “▶ Test” checks whether the AI answers. Keys live in the <code>.env</code> file, never in the interface.</li>
<li><b>Permissions:</b> checkboxes decide what the agent may do (delegate, write files, web, images, media, programming, recruiting, publishing, cloud …). The server checks every permission itself.</li>
<li><b>Team:</b> In the blueprint, drag an agent's bottom dot onto another agent: the second is put under the first. Tapping a line removes the connection. “🗂 Arrange” lays everything out as an org chart. The boss only distributes tasks to their own team.</li>
<li><b>🔀 AI for group:</b> switch several agents to another AI at once.</li>
<li><b>⚠ Models:</b> shows agents whose model no longer exists at the provider and switches them together.</li>
<li><b>🧠 Company knowledge:</b> text that all agents of the project always know (company, customers, style, prices). Documents land in the <code>wissen/</code> folder.</li>
<li><b>Memory:</b> every agent remembers important things from its work by itself (visible and editable at the bottom of the settings).</li></ul>`},
 {id:'auftraege',t:'📬 Tasks, mail and approvals',h:`<ul><li><b>Tasks:</b> In an agent's “Tasks” tab you see all tasks with their status (Queued, Running, Waiting for team, Needs approval, Done, Error). “▶ Start/Again” restarts, “Delete” removes the task including subtasks.</li>
<li><b>📬 Mail:</b> finished results of the top-level tasks. From here you can also send a new task to the boss.</li>
<li><b>Deleting mail:</b> tick messages (or “Select all”) and tap “🗑 Delete selected”. “🧹 Empty mailbox” removes all messages after asking. Only the mail is deleted: tasks, files and history stay.</li>
<li><b>✋ Approvals:</b> things waiting for your OK: commands, publishing, cloud uploads, connections, workshop installations and (if turned on) the boss's plans and team changes. Rejecting ends the task.</li>
<li><b>🎯 Goals:</b> goals and sub-goals of the project. Tasks can be assigned to a goal, the progress is calculated from them.</li>
<li><b>💬 Chat:</b> talk to an agent directly, attach files (📎). A chat can be turned into a task.</li></ul>`},
 {id:'zeitplan',t:'🕘 Schedule and business hours',h:`<ul><li><b>Business hours:</b> outside them the queue waits, nothing runs. Left-over work is resumed when work starts.</li>
<li><b>Daily tasks:</b> choose a time, “at opening” or “at closing” and weekdays. “▶ Run now” starts immediately, “⏸ Turn off” pauses.</li>
<li><b>👑 CEO inspection:</b> the boss checks at closing time whether everything is finished and reports to you.</li>
<li><b>Handover:</b> every assignment keeps its state in <code>handover/assignment-&lt;no&gt;.md</code> in the project folder (who worked with which model, every step, result, next step). If a run stops with an error, the task continues by itself after 5, 10, 20 … minutes; if you give the agent another AI model, it continues right away, and after a restart too. The next model continues from that state.</li></ul>`},
 {id:'betrieb',t:'🛰 Operations center and costs',h:`<ul><li><b>🛰 Operations center:</b> what is running and waiting, open approvals, errors of the last 7 days (↻ Retry restarts them), schedules (▶ Now) and the latest events. Tapping the numbers in the bar also opens it.</li>
<li><b>💶 Costs:</b> estimated AI costs for today and 7 days. Subscription (Claude/Codex CLI) and Ollama count as $0. <b>📊 Usage &amp; costs</b> shows everything by project, agent and model.</li>
<li><b>📜 History:</b> every event is logged and never deleted.</li></ul>`},
 {id:'dateien',t:'📁 Files, cloud and connections',h:`<ul><li><b>📁 Files:</b> everything the agents have created. Tapping opens it, “⬇ Everything as ZIP” downloads the project. Uploaded files land in <code>input/</code>.</li>
<li><b>Publishing a website:</b> if <code>www/index.html</code> is in the project, Hyperstead can serve it as a website (“Publish”).</li>
<li><b>🖨 Printer:</b> choose the printer for the evening reports (network printers via CUPS or Windows). With 🧾 Print test page you see beforehand whether it is the right printer. The CEO allows or blocks printing. Every evening report then shows 🖨 Print; printing happens after your confirmation. Nothing comes out? 🩺 Check printer names the cause (stopped, offline, no driver, stuck job).</li>
<li><b>☁️ Cloud:</b> set up GitHub, Google Drive, OneDrive and Telegram. Every upload by an agent waits for your approval. ☁️ next to a file uploads it yourself.</li>
<li><b>▶️ YouTube:</b> agents with the permission “May manage YouTube” write upload packages (title, description, keywords, hashtags, date) to <code>youtube/</code> and a review list <code>youtube/REVIEW.md</code>, and evaluate CSV exports from YouTube Studio that you upload. Each video upload waits for your approval, is uploaded as private and goes public at the planned time. You sign in the channels yourself once: <code>docs/youtube.md</code>.</li>
<li><b>🔌 Connections:</b> webhooks. Agents with the permission “Connections” may call the addresses you entered (e.g. Zapier, Home Assistant), Hyperstead reports new mail to a service, or other programs send tasks in through a secret inbound address. Without an entry nothing happens.</li></ul>`},
 {id:'stimmen',t:'🎙 Voices and ElevenLabs',h:`<p>Agents with the “Media” permission can have texts spoken (tool <code>speak</code>) and voice film characters. Normally this runs for free on your device (Piper, espeak-ng or Edge voices).</p>
<ul><li><b>Better voices with ElevenLabs:</b> put <code>ELEVENLABS_API_KEY=…</code> into the <code>.env</code> file (key from elevenlabs.io → Profile → API Keys) and restart Hyperstead. Never enter the key in the interface or in chat.</li>
<li><b>Only when needed:</b> with a key everything still stays local and free first. The agents use ElevenLabs specifically where the voice really has to sound good, e.g. audiobook, advertising, main characters or narrator in a film. You can also say it explicitly in the task: “Speak this with ElevenLabs”.</li>
<li><b>Always ElevenLabs:</b> <code>TTS_ENGINE=elevenlabs</code> in the <code>.env</code>. Default voice with <code>ELEVENLABS_VOICE=&lt;voice ID&gt;</code>, model with <code>ELEVENLABS_TTS_MODEL</code> (default <code>eleven_multilingual_v2</code>, which also speaks German and Turkish).</li>
<li><b>Own voice per character:</b> the agents fetch the voices of your ElevenLabs account themselves and enter the matching voice ID for the character.</li>
<li><b>If ElevenLabs does not work</b> (wrong key, no credit, no internet): the local voice speaks automatically, and the result contains a NOTE with the reason. In a film the line is tried again with ElevenLabs the next time it is voiced. With <code>TTS_FALLBACK=0</code> the task stops with the error message instead.</li>
<li><b>Costs:</b> ElevenLabs charges per character. Without a key there are no costs, everything runs as before.</li></ul>`},
 {id:'telegram',t:'📱 Telegram',h:`<p>With <code>TELEGRAM_BOT_TOKEN</code> and <code>TELEGRAM_CHAT_ID</code> in the <code>.env</code> you control Hyperstead from your phone. Only your chat ID may control it.</p>
<ul><li>Just write text = new task for the boss of the selected project. Photos/files with a caption = task with attachment.</li>
<li><code>/post</code> open results, <code>/ok &lt;no&gt;</code> done, replying to a result message = revision.</li>
<li><code>/status</code> overview, <code>/project &lt;no&gt;</code> switch project, <code>/new &lt;text&gt;</code> new task, <code>/file [search]</code> have a file sent, <code>/help</code> all commands.</li>
<li>Approvals come with ✅/❌ buttons, as do stage promotions 🎉.</li></ul>`},
 {id:'probleme',t:'🧯 What to do if …',h:`<ul><li><b>… an agent does nothing:</b> Does it have an AI? (Settings, “▶ Test”). Are business hours active? Is something waiting under ✋ Approvals?</li>
<li><b>… a task shows “Error”:</b> the 🛰 Operations center shows the message. Common causes: missing key or no credit. After fixing it, “↻ Retry”.</li>
<li><b>… ⚠ Models shows a number:</b> a model no longer exists at the provider. Switch them there together.</li>
<li><b>… the boss only plans and delivers nothing:</b> check the permissions (write files, media), and say exactly in the task which file should exist at the end.</li>
<li><b>… Telegram is silent:</b> check token and chat ID in <code>.env</code>, restart Hyperstead, write <code>/start</code> to the bot.</li>
<li><b>… something is missing after an update:</b> the README has the table “What happens if something is missing” with the fix for every file and every key.</li></ul>`},
 {id:'firmen',t:'🏙 All companies: classic and modern',h:`<p>Hyperstead has two levels. Both show the same real companies, departments and agents, just drawn differently.</p>
<ul><li><b>Classic:</b> the plain views of one company: the three org charts (tree, outline, circle) and the blueprint. This is where you manage and hire. In the graphic menu they are under “Classic”.</li>
<li><b>Modern:</b> all companies at once. Open them in the graphic menu at the top in the “Modern” group (🏙 City, 🌌 Cosmos or 🧬 Molecule). The top bar with project and growth stays in place; that is also where you switch back to “Classic”.</li>
<li><b>🏙 City:</b> every company is a building on its own plot. The more it has grown, the taller the building. When a company is working, its lights go on; quiet companies are almost dark.</li>
<li><b>🧬 Molecule:</b> every company is its own molecule, shape and colors differ per company. Partner companies are connected by a glowing rod between their managements, sparks travel along it (more when both are working). Tapping zooms in, every sphere opens department and agent.</li>
<li><b>🖼 Logo:</b> in a company's info panel you can upload your own logo under “Logo” (PNG, JPEG or WebP, at most 2 MB). In the city it stands as a sign on the roof, in the cosmos in the middle of the sun. ✕ removes it again.</li>
<li><b>🌌 Cosmos:</b> every company is a solar system. The sun is the management, the planets are the departments (bigger = more agents), and every employee is a moon of their department's planet. Suns and planets turn on their own axis like real ones, the moons only circle their planet. A glowing ring means: this department is working right now. There are no lines between the systems.</li>
<li><b>Going inside:</b> tapping a company zooms in. In the city you see the building cut open: one floor per hierarchy level, as deep as the company is: the management at the very top on the executive floor, below it the department heads, then every further level. Every person sits in their own room in the color of their department; if a department has 4 people on one level, there are 4 rooms there. Every floor places its rooms centered and evenly spaced, departments stay together, the building is as wide as the fullest floor. The building grows with success: from stage 2 an annex and roof garden, from stage 3 an antenna, from stage 4 a helipad. To the right is the org chart (management at the top, departments below), every circle can be tapped. A glowing screen means: this agent is working right now. In the cosmos the solar system gets big: the sun is the management, every planet a department, the moons circling it are its agents (tap a moon to open that agent).</li>
<li><b>Opening a department:</b> the list of departments is on the left (at the bottom on a phone). Tapping a department, floor or planet shows its team on the right with role, state and running tasks. A name in it opens the agent's panel (tasks, chat, settings) right here, the graphic stays the same. What you change there you also see in city and cosmos.</li>
<li><b>← All companies</b> or Esc takes you back out. The <b>←</b> button in the top bar goes back to the graphic you saw before.</li>
<li><b>Rotating and tilting:</b> at the bottom right ⟲ ⟳ rotate the world, ⤵ ⤴ tilt it backwards, ⌂ or “🗂 Arrange” at the top straightens it again and fits everything in, in case you got lost. With the mouse: hold the right mouse button (or Shift) and drag, sideways = rotate, up/down = tilt. On a phone rotate with two fingers or move both fingers up or down together. The names stay readable, the device remembers the position per world.</li>
<li><b>Choosing a company on the left:</b> if you tap a project in the sidebar on the left, it lights up in city, cosmos and molecule, the other companies fade back, and the view moves to it. Tapping opens it as usual.</li>
<li><b>Adding an agent:</b> the bar below the growth bar is there in every graphic. A new agent goes into the project shown at the top.</li>
<li><b>🤝 Collaboration:</b> at the top (or 🤝 in a company's info panel) you link two companies as partners, “Separate” splits them again. Only partners get a road with delivery vans in the city, and spaceships fly between their suns in the cosmos. If both companies are resting, only one slow vehicle is on the way and the road stays dark. When they work, the road lights up and there is more traffic. Companies without a partnership stay unconnected. The agents notice nothing of this.</li>
<li><b>🔍 Search:</b> type a company or agent at the top (name or role). A hit zooms into the company and shows the agent in their department.</li></ul>`},
 {id:'hilfe',t:'❓ Help mode and hints',h:`<p>Almost every button has a short explanation. On a PC it appears when you point at it with the mouse.</p>
<p>On a phone you cannot point. Turn on the <b>help mode</b> here: then the first tap on a button shows the explanation, only the second tap uses it. A bar appears at the bottom; “Off” ends it.</p>
<p>ⓘ at the top of a window jumps directly to the matching chapter of this guide.</p>`},

const HELP_MAP=[['Approvals','auftraege'],['Mail','auftraege'],['Goals','auftraege'],['Schedule','zeitplan'],['Cloud','dateien'],['Upload','dateien'],['Files','dateien'],['🔌','dateien'],['Operations','betrieb'],['Usage','betrieb'],['History','betrieb'],['Growth','welt'],['models','agenten'],['AI for','agenten'],['Company knowledge','agenten'],['template','start'],['Voice','stimmen'],['Collaboration','firmen']];
function helpFor(title){ if(String(title).startsWith('📖')) return null; const m=HELP_MAP.find(([k])=>String(title).includes(k)); return m?m[1]:null; }
function showHelp(chapter){
  openOv('📖 Guide'); const body=$('#ovbody');

function teamsOf(g){
  // Ein "Team" je Sonne (oberste Ebene) und je Agent mit Unterstellten; members = alle direkt Unterstellten.
  const kids = {}; g.agents.forEach(a=>{ if(a.parent_id && agentById(a.parent_id)) (kids[a.parent_id]=kids[a.parent_id]||[]).push(a); });
  const roots = g.agents.filter(a=>!a.parent_id || !agentById(a.parent_id));
  const teams = [];
  const walk = (a, pt)=>{ const ks=kids[a.id]||[]; let t=null;
    if(!pt || ks.length){ t={lead:a, members:ks, parent:pt, kids:[], idx:teams.length}; teams.push(t); if(pt) pt.kids.push(t); }
    ks.forEach(k=>walk(k, t)); };
  roots.forEach(r=>walk(r, null));
  MAP.kids = kids;
  return teams;
}
function teamState(t){

function orgBaum(roots){  // klassisch von oben nach unten; Mitarbeiter ohne eigenes Team stehen untereinander, Teams nebeneinander
  const W=170, H=54, GX=22, GY=56, nodes=[];
  const split=n=>{ const lv=n.kids.filter(k=>!k.kids.length), tm=n.kids.filter(k=>k.kids.length);
    return lv.length>2 ? {stack:lv, row:tm} : {stack:[], row:n.kids}; };
  const width=n=>{ const sp=split(n); const w=(sp.stack.length?W+GX:0)+sp.row.reduce((s,k)=>s+width(k),0); return Math.max(W+GX, w); };
  const place=(n,x0,y,par)=>{
    const wd=width(n), cx=x0+wd/2, me={n, x:cx-W/2, y, w:W, h:H, par, link:'v'}; nodes.push(me);
    if(!n.kids.length) return;
    const sp=split(n), inner=(sp.stack.length?W+GX:0)+sp.row.reduce((s,k)=>s+width(k),0);
    let x=x0+(wd-inner)/2;
    if(sp.stack.length){
      const sx=x+GX/2;
      sp.stack.forEach((k,i)=>nodes.push({n:k, x:sx+18, y:y+H+GY+i*(H+12), w:W-18, h:H, par:me, link:'stack'}));
      x+=W+GX;
    }
    sp.row.forEach(k=>{ place(k,x,y+H+GY,me); x+=width(k); });
  };
  let x=0; roots.forEach(r=>{ place(r,x,0,null); x+=width(r)+40; });
  return {nodes, extra:''};
}
function orgGliederung(roots){  // von links nach rechts eingerueckt, eine Zeile je Agent (schmal, gut fuers Handy)
  const W=200, H=48, IN=34, GAP=12, nodes=[]; let row=0;
  const walk=(n,par)=>{ const me={n, x:n.d*IN, y:row*(H+GAP), w:W, h:H, par, link:'side'}; row++; nodes.push(me); n.kids.forEach(k=>walk(k,me)); };

function orgKreis(roots){  // Leitung in der Mitte, jede Ebene ein Ring; Winkel nach Groesse der Teams
  const RING=150, nodes=[], rings=[];
  const leaves=n=>n.kids.length ? n.kids.reduce((s,k)=>s+leaves(k),0) : 1;
  const hub = roots.length>1;  // mehrere Leitungen: Projektname in der Mitte
  const base = hub ? 1 : 0, H0={hub:1};
  let maxD=0;
  const place=(n,a0,a1,par)=>{
    const d=n.d+base, ang=(a0+a1)/2, x= d===0?0:Math.cos(ang)*d*RING, y= d===0?0:Math.sin(ang)*d*RING; maxD=Math.max(maxD,d);
    const me={n, x, y, round:1, rad: d===0?34:Math.max(16,26-d*3), par, link:'line'}; nodes.push(me);
    let a=a0; const tot=leaves(n);

  };
  const total=roots.reduce((s,r)=>s+leaves(r),0); let a=-Math.PI/2;
  roots.forEach(r=>{ const span=2*Math.PI*leaves(r)/total; place(r, roots.length>1?a:-Math.PI/2, roots.length>1?a+span:3*Math.PI/2, hub?H0:null); a+=span; });
  for(let d=1; d<=maxD; d++) rings.push(`<circle class="oring" r="${d*RING}"/>`);
  const center = hub ? `<g><circle r="30" class="ohub"/><text class="oini" y="5">${esc(initials((S.graph&&S.graph.project.name)||'P'))}</text></g>` : '';

}

/* Zusammenarbeit (Phase 3): nur zwischen Partner-Firmen gibt es Straßen (Stadt) bzw. Flugrouten (Kosmos). Ohne Partnerschaft keine Linie.
   Verkehr nach echter Aktivität: ruhen beide Firmen, fährt/fliegt nur ein langsames Fahrzeug, arbeiten sie, wird es mehr und schneller. */
function hubTraffic(l){
  const F=HUB.d.firms, fa=F.find(f=>f.id===l.a), fb=F.find(f=>f.id===l.b); if(!fa||!fb) return null;
  const act=(fa.busy||0)+(fb.busy||0), both=fa.busy&&fb.busy;
  return {fa, fb, act, n: act ? Math.min(5, 1+Math.ceil(act/3)+(both?1:0)) : 1, sp: act ? 1.25 : .55, live: act>0};
}
function hubPolyLen(p){ let s=0; for(let k=1;k<p.length;k++) s+=Math.hypot(p[k][0]-p[k-1][0],p[k][1]-p[k-1][1]); return s; }
function hubRoadPath(A,B){  // Straße nur durch die Gassen zwischen den Grundstücken, nie quer über ein anderes Grundstück
  const G=HUB_GAP, S=1+G, [ua,va]=A, [ub,vb]=B, ia=Math.round(ua/S), ja=Math.round(va/S), ib=Math.round(ub/S), jb=Math.round(vb/S);
  if(ja===jb && Math.abs(ia-ib)===1){ const l=ia<ib; return [[l?ua+1:ua, va+.5],[l?ub:ub+1, vb+.5]]; }
  if(ia===ib && Math.abs(ja-jb)===1){ const l=ja<jb; return [[ua+.5, l?va+1:va],[ub+.5, l?vb:vb+1]]; }
  if(ja===jb){ const rc=va+1+G/2; return [[ua+.5,va+1],[ua+.5,rc],[ub+.5,rc],[ub+.5,vb+1]]; }
  if(ia===ib){ const cc=ua+1+G/2; return [[ua+1,va+.5],[cc,va+.5],[cc,vb+.5],[ub+1,vb+.5]]; }
  const down=jb>ja, rc=down?va+1+G/2:va-G/2, right=ib>ia, cc=right?ub-G/2:ub+1+G/2;

function hubCityRoads(at){
  const out=[], veh=[]; HUB.tr=[];
  HUB.d.links.forEach((l,n)=>{
    const T=hubTraffic(l); if(!T || !at[l.a] || !at[l.b]) return;
    const P=hubRoadPath(at[l.a], at[l.b]).map(([u,v])=>iso(u,v));
    const d='M'+P.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
    out.push(`<g class="road${T.live?' live':''}"><title>Collaboration: ${esc(T.fa.name)} ↔ ${esc(T.fb.name)}${l.note?' – '+esc(l.note):''}${T.live?' · active':' · quiet right now'}</title>
      <path class="rg" d="${d}"/><path class="re" d="${d}"/><path class="rw" d="${d}"/><path class="rl" d="${d}"/></g>`);
    for(let k=0;k<T.n;k++){ HUB.tr.push({p:P, len:hubPolyLen(P), sp:T.sp*(1+.12*(k%3)), o:k/T.n+n*.13, iso:true});
      veh.push(`<g class="veh van"><title>Delivery: ${esc(T.fa.name)} ↔ ${esc(T.fb.name)}</title>
        <g class="vb"><ellipse rx="10" ry="4" cy="3" fill="#000" opacity=".4"/><polygon points="-10,-2 0,-7 10,-2 0,3" fill="#e2e8f0"/><polygon points="-10,-2 0,3 0,8 -10,3" fill="#94a3b8"/><polygon points="0,3 10,-2 10,3 0,8" fill="#64748b"/><circle cx="9" cy="1" r="2.2" class="hl"/></g></g>`); }

}
function hubCosmosRoutes(pos){
  const veh=[]; HUB.tr=[];
  HUB.d.links.forEach((l,n)=>{
    const T=hubTraffic(l), A=pos[l.a], B=pos[l.b]; if(!T||!A||!B) return;
    const mx=(A[0]+B[0])/2, my=(A[1]+B[1])/2, dx=B[0]-A[0], dy=B[1]-A[1], L=Math.hypot(dx,dy)||1, bend=L*.18*(n%2?1:-1);
    const cx=mx-dy/L*bend, cy=my+dx/L*bend, P=[];
    for(let k=0;k<=32;k++){ const t=k/32, u=1-t; P.push([u*u*A[0]+2*u*t*cx+t*t*B[0], u*u*A[1]+2*u*t*cy+t*t*B[1]]); }
    if(T.live) veh.unshift(`<path class="sroute" d="M${P.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L')}"><title>Active collaboration: ${esc(T.fa.name)} ↔ ${esc(T.fb.name)}</title></path>`);
    for(let k=0;k<T.n;k++){ HUB.tr.push({p:P, len:hubPolyLen(P), sp:T.sp*1.8*(1+.15*(k%3)), o:k/T.n+n*.21, ship:true});
      veh.push(`<g class="veh ship${T.live?' live':''}"><title>Collaboration: ${esc(T.fa.name)} ↔ ${esc(T.fb.name)}${l.note?' – '+esc(l.note):''}${T.live?' · active':' · quiet right now'}</title>
        <g class="sb" transform="scale(1.7)"><path class="trail" d="M-6,0 L-40,-3.5 L-40,3.5 Z"/><path d="M12,0 L2,-3 L-6,-9 L-4,-3 L-7,0 L-4,3 L-6,9 L2,3 Z" fill="#e2e8f0" stroke="#7dd3fc" stroke-width="1"/><ellipse cx="4" rx="3" ry="1.6" fill="#38bdf8"/><circle cx="-7" r="2.6" class="flame"/></g></g>`); }

function hubAlong(m,t){  // Fahrzeug hin und zurück entlang der Strecke; liefert Punkt und Richtung
  let s=((t*m.sp*40/m.len)+m.o)%2, back=s>1; if(back) s=2-s;

function hubEnter(pid, dep, agent){
  const el=$('#hubsvg').querySelector(`.firm[data-firm="${pid}"]`);
  hubZoomTo(HUB.inside?null:el, ()=>{ HUB.inside=pid; HUB.sel=null; HUB.dep=dep===undefined?null:dep; HUB.cardOff=innerWidth<=820 && HUB.dep===null; HUB.agent=agent||null; HUB.sig=''; drawHub(); fit(); gNote(); });
}
function hubLeave(){ const pid=HUB.inside; HUB.inside=null; HUB.dep=null; HUB.agent=null; HUB.sig=''; $('#hubcard').classList.remove('on'); drawHub(); fit(); if(pid) hubSelect(pid); gNote(); }
function hubDep(dep, agent){ HUB.cardOff=false; HUB.dep=dep; HUB.agent=agent||null; HUB.sig=''; drawHub(); gNote(); }
$('#hubsvg').addEventListener('click', e=>{
  if(MAP.down && Math.hypot(e.clientX-MAP.down.x, e.clientY-MAP.down.y)>6) return;
  if(HUB.inside){
    const a=e.target.closest('[data-agent]'); if(a) return hubDep(+a.dataset.dep, +a.dataset.agent);
    const d=e.target.closest('[data-dep]'); if(d) return hubDep(+d.dataset.dep);
    return;
  }
  const b=e.target.closest('.firm'); if(b) hubEnter(+b.dataset.firm); else hideHubCard();
});
$('#hubsvg').addEventListener('keydown', e=>{ if(e.key!=='Enter' && e.key!==' ') return;
  const d=HUB.inside && e.target.closest('[data-dep]'), b=e.target.closest('.firm');
  if(d){ e.preventDefault(); hubDep(+d.dataset.dep); } else if(b){ e.preventDefault(); hubEnter(+b.dataset.firm); } });
$('#hubcard').addEventListener('click', e=>{ const a=e.target.closest('.hc-ag'); if(!a) return;
  if(a.dataset.dep!==undefined && !a.dataset.agent) return HUB.inside ? hubDep(+a.dataset.dep) : hubEnter(+a.dataset.firm, +a.dataset.dep);
  hubOpenFirm(+a.dataset.firm, +a.dataset.agent); });
$('#hubdeps').addEventListener('click', e=>{ const b=e.target.closest('.hd'); if(b) hubDep(b.dataset.dep===''?null:+b.dataset.dep); });
$('#hubOut').onclick=hubLeave;
document.querySelectorAll('#hubbar [data-hubworld]').forEach(b=>b.onclick=()=>hubWorld(b.dataset.hubworld));
document.addEventListener('keydown', e=>{ if(e.key!=='Escape' || VIEW!=='hub' || $('#ov').classList.contains('on')) return;
  if(!$('#hubResults').hidden) return hubSearchClose();
  if(HUB.inside) hubLeave(); else if(HUB.sel) hideHubCard(); });
/* Suche nach Firmen und Agenten (über alle Firmen) */
function hubSearchClose(){ $('#hubResults').hidden=true; }
$('#hubSearch').addEventListener('input', e=>{
  const q=e.target.value.trim().toLowerCase(), box=$('#hubResults');
  if(!q || !HUB.d){ box.hidden=true; return; }
  const hits=[];
  HUB.d.firms.forEach(f=>{
    if(f.name.toLowerCase().includes(q)) hits.push({f, label:f.name, sub:'Company · '+(f.stage_name||'')});
    const T=hubTeams(f);
    f.agents.forEach(a=>{ if((a.name+' '+(a.role||'')).toLowerCase().includes(q)){
      const dep=T.roots.includes(a)?-1:T.deps.findIndex(d=>d.members.includes(a));
      hits.push({f, a, dep, label:a.name, sub:(a.role?a.role+' · ':'')+f.name}); } });
  });
  box.innerHTML = hits.slice(0,10).map((h,i)=>`<button class="hr" data-i="${i}" title="${h.a?'Show the agent in their department':'Zoom into the company'}">${h.a?'👤':'🏢'} ${esc(h.label)}<small>${esc(h.sub)}</small></button>`).join('') || '<div class="hr-none">Nothing found</div>';
  box._hits=hits; box.hidden=false;
});
$('#hubSearch').addEventListener('keydown', e=>{ if(e.key==='Enter'){ const b=$('#hubResults').querySelector('.hr'); if(b) b.click(); } });
$('#hubResults').addEventListener('click', e=>{ const b=e.target.closest('.hr'); if(!b) return; const h=$('#hubResults')._hits[+b.dataset.i]; hubSearchClose(); $('#hubSearch').value='';
  HUB.inside=null; HUB.sig=''; drawHub(); hubEnter(h.f.id, h.a?h.dep:null, h.a?h.a.id:null); });
document.addEventListener('click', e=>{ if(!e.target.closest('#hubFind')) hubSearchClose(); });

/* ---------- Atom: Molekül-Netzwerk. Große Kugel = Leitung, mittlere = Teamleiter, kleine = Agenten; jede Kugel hängt per Stab an ihrem
   Vorgesetzten (Organigramm), angeordnet locker und räumlich wie ein Molekülmodell (Wunsch ABI 2026-11-04). Steht still, keine Animation. ---------- */
const ATOM = {box:null, sig:'', mv:[]};
const ATOM_MID=['#fb923c','#2dd4bf','#a78bfa','#4ade80','#f472b6','#facc15'];      // Teamleiter: orange, türkis, violett, grün, ...
const ATOM_SMALL=['#f43f5e','#fde047','#38bdf8','#c084fc','#34d399','#fb7185','#a3e635','#f59e0b'];  // Agenten: kräftige Ergänzungsfarben
/* Jede Firma bekommt ihr eigenes Molekül (Wunsch ABI 2026-11-04): Saat = Projekt-ID bestimmt Form (Spreizung, Stablänge, Streckung,
   Drehung) und die Farbreihe; die große Kugel hat die Farbe der Firma. Gleiche Firma = immer gleiches Molekül. */
function molStyle(seed, col){
  const R=rnd(seed*7919+13), k=Math.floor(R()*ATOM_MID.length), j=Math.floor(R()*ATOM_SMALL.length);
  return {col:col||'#22d3ee', mid:[...ATOM_MID.slice(k),...ATOM_MID.slice(0,k)], small:[...ATOM_SMALL.slice(j),...ATOM_SMALL.slice(0,j)],
    spread:.75+R()*.8, bond:.75+R()*.65, squash:.62+R()*.4, turn:R()*6.28, seed};
}
function molLayout(roots, st){  // Startplätze im Fächer um den Vorgesetzten, dann Abstoßen/Federn (deterministisch)
  const RND=rnd(st.seed*613+7), N=[], E=[], sq=st.squash, BL=st.bond;
  const rad=d=>d===0?44:d===1?27:d===2?18:13;
  const add=(n,x,y,z,dir,spread,par,bi,ci)=>{
    const me={n, x, y, z, r:rad(n.d), d:n.d, branch:bi, col: n.d===0?st.col:n.d===1?st.mid[bi%st.mid.length]:st.small[(bi*3+ci)%st.small.length]};
    N.push(me); if(par) E.push([par,me]);
    const k=n.kids.length; n.kids.forEach((c,j)=>{
      const t=k===1?0:(j/(k-1)-.5), ang=dir+t*spread+(RND()-.5)*.5, L=me.r+rad(c.d)+(58+RND()*46)*BL, zz=(RND()-.5)*1.6;
      add(c, x+Math.cos(ang)*L, y+Math.sin(ang)*L*sq, zz, ang, Math.min(2.6, (1.1+k*.22)*st.spread), me, n.d===0?j:bi, j);
    });
  };
  const k=roots.length;
  roots.forEach((r,i)=>{
    const a0=k===1?0:i*2*Math.PI/k-Math.PI/2+st.turn, D=k===1?0:150+k*20, cx=Math.cos(a0)*D, cy=Math.sin(a0)*D*sq;
    if(k===1){  // einzelne Leitung: Teams rundherum, leicht unregelmäßig
      const me={n:r, x:0, y:0, z:0, r:rad(0), d:0, branch:0, col:st.col}; N.push(me);
      const m=r.kids.length, off=st.turn, arc=m<=2?Math.PI*(.7+st.spread*.5):2*Math.PI;  // wenige Teams: mal gestreckt, mal geknickt
      r.kids.forEach((c,j)=>{ const ang=off+j*arc/Math.max(1,m)+(RND()-.5)*.6, L=me.r+rad(1)+(70+RND()*50)*BL;
        add(c, Math.cos(ang)*L, Math.sin(ang)*L*sq, (RND()-.5)*1.6, ang, Math.min(2.4, (1+c.kids.length*.25)*st.spread), me, j, 0); });
    } else add(r, cx, cy, 0, a0, 2.6, null, i, 0);
  });
  if(k>1) for(let i=0;i<k;i++) E.push([N.find(m=>m.n===roots[i]), N.find(m=>m.n===roots[(i+1)%k]), true]);  // mehrere Leitungen: lockere Querbindung
  for(let it=0; it<160; it++){  // entzerren: Kugeln stoßen sich ab, Stäbe halten ihre Länge
    for(let i=0;i<N.length;i++) for(let j=i+1;j<N.length;j++){ const A=N[i], B=N[j]; let dx=B.x-A.x, dy=B.y-A.y, d=Math.hypot(dx,dy)||.01;
      const want=A.r+B.r+34; if(d<want){ const f=(want-d)/d*.5; dx*=f; dy*=f; if(A.d) { A.x-=dx; A.y-=dy; } if(B.d) { B.x+=dx; B.y+=dy; } } }
    E.forEach(([A,B,x])=>{ if(x) return; let dx=B.x-A.x, dy=B.y-A.y, d=Math.hypot(dx,dy)||.01, L=A.r+B.r+72*BL, f=(d-L)/d*.15; B.x-=dx*f; B.y-=dy*f; if(A.d){ A.x+=dx*f*.3; A.y+=dy*f*.3; } });
  }
  return {N, E};
}
/* Molekül als SVG. o: gp = Präfix der Farbverläufe, blur = Filter-ID, sel = gewählter Agent, state(a) = Zustand,
   attrs(m) = Zusatzattribute je Kugel (Klick-Ziele), labels: 'all' | 'auto' | 'none'. */
function molSvg(roots, st, o){
  const {N, E}=molLayout(roots, st), few=N.length<=16, grads={}, bonds=[], balls=[];
  const grad=c=>{ const id=o.gp+c.slice(1); grads[id]=`<radialGradient id="${id}" cx="34%" cy="30%" r="72%"><stop offset="0" stop-color="#ffffff"/><stop offset=".18" stop-color="${shade(c,.45)}"/><stop offset=".6" stop-color="${c}"/><stop offset="1" stop-color="${shade(c,-.62)}"/></radialGradient>`; return id; };
  E.forEach(([A,B,x])=>{ const s=x?'.35':'1';
    bonds.push(`<g opacity="${s}"><line x1="${A.x.toFixed(1)}" y1="${A.y.toFixed(1)}" x2="${B.x.toFixed(1)}" y2="${B.y.toFixed(1)}" class="abond"/><line x1="${A.x.toFixed(1)}" y1="${A.y.toFixed(1)}" x2="${B.x.toFixed(1)}" y2="${B.y.toFixed(1)}" class="abond2"/></g>`); });
  [...N].sort((p,q)=>p.z-q.z).forEach(m=>{
    const a=m.n.a, stt=o.state?o.state(a):'idle', r=m.r*(1+m.z*.1), root=m.d===0, dim=m.z<-.4?' back':'';
    const name=a.name.length>16?a.name.slice(0,15)+'…':a.name, lab=o.labels==='all'||(o.labels==='auto'&&(root||m.d===1||few));
    balls.push(`<g class="el${root?' nuc':''}${dim}${o.sel===a.id?' sel':''}" ${o.attrs?o.attrs(m):''} transform="translate(${m.x.toFixed(1)},${m.y.toFixed(1)})" aria-label="${esc(a.name)}: ${STATE_TEXT[stt]}">
      <title>${esc(a.name)}${a.role?' – '+esc(a.role):''} · ${root?'Management':m.d===1?'Team lead':'Level '+(m.d+1)} · ${STATE_TEXT[stt]}</title>
      <circle r="${(r*1.9).toFixed(1)}" fill="${m.col}" opacity="${root?.22:.13}" filter="url(#${o.blur})"/>
      <ellipse cx="${(r*.18).toFixed(1)}" cy="${(r*.9).toFixed(1)}" rx="${(r*.8).toFixed(1)}" ry="${(r*.22).toFixed(1)}" fill="#000" opacity=".28"/>
      <circle class="core" r="${r.toFixed(1)}" fill="url(#${grad(m.col)})"/>
      <ellipse cx="${(-r*.32).toFixed(1)}" cy="${(-r*.4).toFixed(1)}" rx="${(r*.3).toFixed(1)}" ry="${(r*.17).toFixed(1)}" fill="#fff" opacity=".55" transform="rotate(-30 ${(-r*.32).toFixed(1)} ${(-r*.4).toFixed(1)})"/>
      ${stt!=='idle'?`<circle r="${(r+4).toFixed(1)}" fill="none" stroke="${ORG_COL[stt]}" stroke-width="${root?3:2.5}"/>`:''}
      ${lab?`<text class="${root?'nlbl':'albl'}" y="${(r+(root?22:15)).toFixed(1)}">${esc(name)}</text>`:''}
      ${lab&&(root||m.d===1)&&a.role?`<text class="albl2" y="${(r+(root?37:28)).toFixed(1)}">${esc(a.role.length>20?a.role.slice(0,19)+'…':a.role)}</text>`:''}</g>`);
  });
  const xs=N.map(m=>m.x), ys=N.map(m=>m.y);
  return {N, defs:Object.values(grads).join(''), svg:`<g>${bonds.join('')}</g>`+balls.join(''),
    box:{x0:Math.min(...xs)-80, x1:Math.max(...xs)+80, y0:Math.min(...ys)-80, y1:Math.max(...ys)+90}};
}
function drawAtom(){
  const g=S.graph, svg=$('#atomsvg');
  if(!g || VIEW!=='atom'){ svg.innerHTML=''; ATOM.box=null; ATOM.sig=''; ATOM.mv=[]; return; }
  const sig=JSON.stringify([S.pid,S.sel,g.agents.map(a=>[a.id,a.parent_id,a.name,a.role,a.paused,a.counts]),WORLD.g&&WORLD.g.stage]);
  if(sig===ATOM.sig && svg.firstChild) return; ATOM.sig=sig;
  const roots=orgTree(g); if(!roots.length){ svg.innerHTML=''; ATOM.box=null; ATOM.mv=[]; return; }
  const pi=Math.max(0,(S.projects||[]).findIndex(p=>p.id===S.pid));  // gleiche Farbe wie der Punkt in der Projektliste
  const M=molSvg(roots, molStyle(S.pid||1, COLORS[pi%COLORS.length]), {gp:'aG', blur:'aBlur', sel:S.sel, state:agentState, labels:'auto',
    attrs:m=>`data-agent="${m.n.a.id}" tabindex="0" role="button"`});
  const {x0:X0,x1:X1,y0:Y0,y1:Y1}=M.box, R=Math.max(X1-X0, Y1-Y0)/2, cx=(X0+X1)/2, cy=(Y0+Y1)/2;
  const defs=`<defs><radialGradient id="aP" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffb4a8"/><stop offset=".45" stop-color="#e2463a"/><stop offset="1" stop-color="#5c0d0a"/></radialGradient>
    <filter id="aBlur" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="8"/></filter>${M.defs}</defs>`;
  const back=`<g transform="translate(${cx.toFixed(0)},${cy.toFixed(0)})">${atomSky({x0:-R-320,x1:R+320,y0:-R-220,y1:R+220}, (WORLD.g&&WORLD.g.stage)||0, R*.8)}</g>`;
  svg.innerHTML=defs+back+M.svg;
  ATOM.box=M.box; ATOM.mv=[]; ATOM.els=[];
  atomPlace();
}
function atomSky(b, stage, R0){  // Welt Atom: ruhiger Hintergrund, der mit der Stufe waechst (Quark, Atom, Molekuel, Kristall, Zelle)
  const RND=rnd((S.pid||1)*977), W=b.x1-b.x0, H=b.y1-b.y0, out=[];
  for(let i=0;i<260;i++){ const m=Math.pow(RND(),3); out.push(`<circle cx="${(b.x0+RND()*W).toFixed(0)}" cy="${(b.y0+RND()*H).toFixed(0)}" r="${(.3+m*1.4).toFixed(2)}" fill="${RND()>.5?'#67e8f9':'#c4b5fd'}" opacity="${(.12+m*.4).toFixed(2)}"/>`); }
  if(stage>=4){  // Zelle: Membran und Erbgut-Doppelhelix
    out.push(`<circle r="${(R0*1.55).toFixed(0)}" fill="none" stroke="#34d399" stroke-opacity=".10" stroke-width="40"/><circle r="${(R0*1.55).toFixed(0)}" fill="none" stroke="#34d399" stroke-opacity=".18" stroke-width="2"/>`);
    let h=''; const x0=b.x0+W*.06, len=W*.88;
    for(let i=0;i<=64;i++){ const t=i/64, x=x0+t*len, y=b.y0+H*.86-t*H*.12, a=t*Math.PI*9, d=26*Math.sin(a);
      h+=`<circle cx="${x.toFixed(0)}" cy="${(y+d).toFixed(0)}" r="3" fill="#f472b6" opacity=".35"/><circle cx="${x.toFixed(0)}" cy="${(y-d).toFixed(0)}" r="3" fill="#60a5fa" opacity=".35"/>`;
      if(i%2===0) h+=`<line x1="${x.toFixed(0)}" y1="${(y+d).toFixed(0)}" x2="${x.toFixed(0)}" y2="${(y-d).toFixed(0)}" stroke="#e0f2fe" stroke-opacity=".12"/>`; }
    out.push(`<g>${h}</g>`);
  }
  if(stage>=3){  // Kristall: Gitter aus Atomen
    let h=''; const step=120;
    for(let x=Math.floor(b.x0/step)*step; x<=b.x1; x+=step) for(let y=Math.floor(b.y0/step)*step; y<=b.y1; y+=step){
      if(Math.hypot(x,y)<R0*1.15) continue;
      h+=`<line x1="${x}" y1="${y}" x2="${x+step}" y2="${y}" stroke="#a5f3fc" stroke-opacity=".06"/><line x1="${x}" y1="${y}" x2="${x}" y2="${y+step}" stroke="#a5f3fc" stroke-opacity=".06"/><circle cx="${x}" cy="${y}" r="4" fill="#a5f3fc" opacity=".14"/>`; }
    out.push(`<g>${h}</g>`);
  }
  if(stage>=2){  // Molekuel: Nachbaratome mit Bindungen zum eigenen Atom
    const n=3+Math.min(2,stage-2);
    for(let i=0;i<n;i++){ const a=-2.2+i*2*Math.PI/n+RND()*.4, d=R0*1.32, x=Math.cos(a)*d, y=Math.sin(a)*d*.8, r0=R0*.22;
      const bx=Math.cos(a)*R0*.16, by=Math.sin(a)*R0*.13, ex=x-Math.cos(a)*r0, ey=y-Math.sin(a)*r0*.8, nx=-Math.sin(a)*4, ny=Math.cos(a)*4;
      out.push(`<line x1="${(bx+nx).toFixed(0)}" y1="${(by+ny).toFixed(0)}" x2="${(ex+nx).toFixed(0)}" y2="${(ey+ny).toFixed(0)}" stroke="#e0f2fe" stroke-opacity=".16" stroke-width="2"/><line x1="${(bx-nx).toFixed(0)}" y1="${(by-ny).toFixed(0)}" x2="${(ex-nx).toFixed(0)}" y2="${(ey-ny).toFixed(0)}" stroke="#e0f2fe" stroke-opacity=".16" stroke-width="2"/>
        <g transform="translate(${x.toFixed(0)},${y.toFixed(0)})" opacity=".55"><ellipse rx="${r0.toFixed(0)}" ry="${(r0*.34).toFixed(0)}" class="aorbit" transform="rotate(30)"/><ellipse rx="${r0.toFixed(0)}" ry="${(r0*.34).toFixed(0)}" class="aorbit" transform="rotate(-30)"/><circle r="${(r0*.18).toFixed(0)}" fill="url(#aP)"/></g>`); }
  }
  if(stage<=0){  // Quark: drei farbige Quarks leuchten im Kern
    out.push(['#ef4444','#22c55e','#3b82f6'].map((c,i)=>`<circle cx="${(Math.cos(i*2.094-1.57)*16).toFixed(0)}" cy="${(Math.sin(i*2.094-1.57)*16).toFixed(0)}" r="70" fill="${c}" opacity=".07"/>`).join(''));
  }
  return out.join('');
}
function atomPlace(){}  // Plätze stehen fest (atomLayout), die Grafik bewegt sich nicht (Wunsch ABI)
$('#atomsvg').addEventListener('click', e=>{ if(MAP.down && Math.hypot(e.clientX-MAP.down.x, e.clientY-MAP.down.y)>6) return; const c=e.target.closest('[data-agent]'); if(c) selectAgent(+c.dataset.agent); });
$('#atomsvg').addEventListener('keydown', e=>{ if(e.key!=='Enter' && e.key!==' ') return; const c=e.target.closest('[data-agent]'); if(c){ e.preventDefault(); selectAgent(+c.dataset.agent); } });
